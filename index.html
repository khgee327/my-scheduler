<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스케줄러</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2265%25%22 font-size=%2270%22 text-anchor=%22middle%22>💖</text></svg>">
<style>
  :root{
    --bg:#fdf6f8;
    --card:#ffffff;
    --border:#f5dbe4;
    --text:#2b2430;
    --text-soft:#8a7480;
    --accent:#f472b6;
    --accent-dark:#db2777;
    --accent-soft:#fdf2f8;
    --accent-2:#fb7185;
    --danger:#ef4444;
    --danger-soft:#fee2e2;
    --shadow:0 4px 16px rgba(219,119,150,0.08);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:28px 40px 8px;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
  }
  header p{
    margin:6px 0 0;
    color:var(--text-soft);
    font-size:14px;
  }
  .dashboard-stack{
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:20px 40px 40px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
  }
  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .card-header h2{
    font-size:16px;
    font-weight:700;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-header h2 .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .today-date-badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--accent-dark);
    background:var(--accent-soft);
    padding:5px 12px;
    border-radius:999px;
    white-space:nowrap;
    margin-bottom:12px;
  }

  /* Date/week navigation */
  .day-nav{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .day-nav .nav-btn{
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    width:26px;height:26px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
  }
  .day-nav .nav-btn:hover{ background:#fbcfe8; }
  .day-nav .nav-today-btn{
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    padding:0 10px;
    height:26px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
  }
  .day-nav .nav-today-btn:hover{ background:#fbcfe8; }
  .day-nav input[type=date]{
    border:1px solid var(--border);
    border-radius:8px;
    padding:4px 6px;
    font-size:11.5px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    height:26px;
  }

  /* Drag & drop */
  [draggable="true"]{ cursor:grab; }
  [draggable="true"]:active{ cursor:grabbing; }
  .dragging{ opacity:0.4; }
  .drop-hover{
    outline:2px dashed var(--accent-dark);
    outline-offset:-2px;
    background:var(--accent-soft) !important;
  }

  /* Quick Memo */
  .memo-card{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    background:#fdf7f9;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .memo-card .txt{
    flex:1;
    font-size:13.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .memo-card button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .memo-card button.del:hover{ color:var(--danger); }
  .memo-empty{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:18px 0;
  }

  /* Category tag & select */
  .cat-tag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  select.cat-select{
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    background:#fff;
    color:var(--text);
    outline:none;
    cursor:pointer;
  }
  select.cat-select:focus{ border-color:var(--accent); }

  /* Date range picker */
  .date-range-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-basis:100%;
  }
  .date-range-row .date-input{
    flex:1;
    min-width:0;
    padding:7px 8px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:11.5px;
    font-family:inherit;
    color:var(--text);
    background:#fff;
    outline:none;
  }
  .date-range-row .date-input:focus{ border-color:var(--accent); }
  .date-range-row .sep{
    color:var(--text-soft);
    font-size:12px;
    flex-shrink:0;
  }
  input.link-input{
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--text);
    outline:none;
  }
  input.link-input:focus{ border-color:var(--accent); }
  a.link-icon{
    flex-shrink:0;
    text-decoration:none;
    line-height:1;
    cursor:pointer;
  }

  /* Calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cal-nav button{
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
  }
  .cal-nav button:hover{ background:#fbcfe8; }
  .cal-title{
    font-weight:700;
    font-size:15px;
    min-width:90px;
    text-align:center;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
  }
  .cal-grid .dow{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--text-soft);
    padding-bottom:6px;
  }
  .cal-day{
    position:relative;
    min-height:96px;
    border-radius:10px;
    padding:6px 6px;
    background:#fdf7f9;
    border:1px solid transparent;
    transition:background .15s, border-color .15s;
    overflow:visible;
  }
  .cal-day:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .cal-day.empty{
    background:transparent;
  }
  .cal-day.empty:hover{
    border-color:transparent;
    background:transparent;
  }
  .cal-day .num{
    font-size:12px;
    font-weight:600;
    color:var(--text);
  }
  .cal-day.today{
    background:var(--accent);
  }
  .cal-day.today .num{
    color:#fff;
    font-weight:800;
  }
  .day-add-btn{
    position:absolute;
    top:4px;
    right:4px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
    z-index:2;
  }
  .cal-day:hover .day-add-btn{ display:flex; }
  .cal-day.today .day-add-btn{ background:#fff; color:var(--accent-dark); }

  /* Multi-day continuous bars */
  .cal-bars{
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:2px;
    position:relative;
    z-index:1;
  }
  .cal-bar{
    position:relative;
    display:flex;
    align-items:center;
    height:15px;
    font-size:9.5px;
    font-weight:700;
    padding:0 5px;
    overflow:hidden;
    white-space:nowrap;
    cursor:pointer;
  }
  .cal-bar.seg-start{
    border-top-left-radius:5px;
    border-bottom-left-radius:5px;
  }
  .cal-bar.seg-end{
    border-top-right-radius:5px;
    border-bottom-right-radius:5px;
  }
  .cal-bar:not(.seg-start){ margin-left:-8px; padding-left:9px; }
  .cal-bar:not(.seg-end){ margin-right:-8px; }
  .cal-bar .txt{ overflow:hidden; text-overflow:ellipsis; }
  .cal-bar.done .txt{ text-decoration:line-through; opacity:.7; }
  .cal-bar-del{
    position:absolute;
    right:3px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    color:inherit;
    font-size:10px;
    line-height:1;
    cursor:pointer;
    display:none;
  }
  .cal-bar:hover .cal-bar-del{ display:inline; }

  /* Single-day badges */
  .day-badges{
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:2px;
    max-height:130px;
    overflow-y:auto;
  }
  .day-badge{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2px;
    font-size:9.5px;
    font-weight:700;
    padding:2px 5px;
    border-radius:5px;
    overflow:hidden;
    flex-shrink:0;
    cursor:pointer;
  }
  .day-badge .txt{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .day-badge.done .txt{
    text-decoration:line-through;
    opacity:.6;
  }
  .day-badge-del{
    border:none;
    background:transparent;
    color:inherit;
    cursor:pointer;
    font-size:10px;
    line-height:1;
    padding:0 2px;
    display:none;
    flex-shrink:0;
  }
  .day-badge:hover .day-badge-del{ display:inline; }

  /* Add-task modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,36,48,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:22px;
    width:100%;
    max-width:360px;
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
  }
  .modal-box h3{
    margin:0 0 14px;
    font-size:15px;
    font-weight:700;
  }
  .modal-box input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    outline:none;
  }
  .modal-box input[type=text]:focus{ border-color:var(--accent); }
  .modal-box select.cat-select{
    width:100%;
    margin-top:10px;
    padding:10px 12px;
    font-size:14px;
  }
  .modal-box .date-range-row{
    margin-top:10px;
  }
  .modal-box .date-range-row .date-input{
    padding:9px 8px;
    font-size:12.5px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:16px;
  }
  .modal-actions button{
    border:none;
    border-radius:8px;
    padding:8px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .modal-actions .cancel-btn{
    background:var(--bg);
    color:var(--text-soft);
  }
  .modal-actions .cancel-btn:hover{ background:#f5e3ea; }
  .modal-actions .confirm-btn{
    background:var(--accent);
    color:#fff;
  }
  .modal-actions .confirm-btn:hover{ background:var(--accent-dark); }
  .modal-actions .delete-btn{
    margin-right:auto;
    background:var(--danger-soft);
    color:var(--danger);
  }
  .modal-actions .delete-btn:hover{ background:#fecaca; }

  /* Weekly tasks - unified grid (headers + multi-day bars + single-day cards) */
  .week-range{
    display:block;
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
    margin-bottom:12px;
  }
  .week-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    column-gap:14px;
    row-gap:6px;
  }
  .week-grid-header{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:8px;
    padding-right:22px;
    border-bottom:1px dashed var(--border);
  }
  .week-grid-header.today-col{ border-bottom-color:var(--accent); }
  .week-grid-header .day-label{
    font-size:13px;
    font-weight:700;
  }
  .week-add-btn{
    position:absolute;
    top:50%;
    right:0;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:13px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .week-grid-header:hover .week-add-btn{ display:flex; }
  .week-grid-bar{
    position:relative;
    display:flex;
    align-items:center;
    gap:5px;
    height:26px;
    padding:0 8px;
    font-size:11.5px;
    font-weight:700;
    overflow:hidden;
    border-radius:8px;
  }
  .week-grid-bar.trunc-start{ border-top-left-radius:0; border-bottom-left-radius:0; }
  .week-grid-bar.trunc-end{ border-top-right-radius:0; border-bottom-right-radius:0; }
  .week-grid-bar input[type=checkbox]{
    flex-shrink:0;
    width:14px;height:14px;
    cursor:pointer;
  }
  .week-grid-bar .txt{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .week-grid-bar.done .txt{ text-decoration:line-through; opacity:.7; }
  .week-grid-bar a.link-icon{ font-size:10px; }
  .week-grid-bar .tl-edit{
    flex-shrink:0;
    border:none;
    background:rgba(255,255,255,0.55);
    color:inherit;
    border-radius:4px;
    width:18px;height:18px;
    font-size:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .week-grid-bar .tl-edit:hover{ background:rgba(255,255,255,0.9); }
  .week-grid-cards{
    background:#fdf7f9;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:90px;
  }
  .week-grid-cards.today-col{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .week-task-item{
    display:flex;
    align-items:flex-start;
    gap:6px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
  }
  .week-task-item input[type=checkbox]{
    width:15px;height:15px;
    margin-top:2px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
  }
  .week-task-item .label{
    flex:1;
    font-size:12.5px;
    line-height:1.4;
    word-break:break-word;
  }
  .week-task-item.done .label{
    text-decoration:line-through;
    color:var(--text-soft);
  }
  .week-task-item button.edit,
  .week-task-item button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:11px;
    padding:0 2px;
    flex-shrink:0;
  }
  .week-task-item button.edit:hover{ color:var(--accent-dark); }
  .week-task-item button.del:hover{ color:var(--danger); }
  .week-task-item.editing{
    flex-direction:column;
    align-items:stretch;
    gap:6px;
    border-color:var(--accent);
  }
  .week-task-item select.cat-select{
    width:100%;
    font-size:11.5px;
    padding:6px 8px;
  }
  .week-task-item .edit-input{
    width:100%;
    font-size:12px;
    padding:6px 8px;
    border:1px solid var(--accent);
    border-radius:6px;
    outline:none;
  }
  .week-task-item .date-range-row .date-input{
    font-size:11px;
    padding:6px 6px;
  }
  .week-task-item .edit-actions{
    display:flex;
    justify-content:flex-end;
    gap:6px;
  }
  .week-task-item button.save{
    border:none;
    background:var(--accent-2);
    color:#fff;
    border-radius:6px;
    width:24px;height:24px;
    cursor:pointer;
    font-size:12px;
    flex-shrink:0;
  }
  .week-task-item button.save:hover{ background:var(--accent-dark); }
  .week-col-empty{
    color:var(--text-soft);
    font-size:11.5px;
    text-align:center;
    padding:10px 0;
  }

  .progress-wrap{
    margin-top:16px;
  }
  .progress-bar{
    height:8px;
    background:var(--accent-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:999px;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-soft);
    margin-top:6px;
    font-weight:600;
  }

  .add-row.simple{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .add-row.simple input[type=text]{
    flex:1;
    min-width:120px;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    outline:none;
  }
  .add-row.simple input[type=text]:focus{ border-color:var(--accent); }
  .add-row.simple select.cat-select{
    width:112px;
    flex-shrink:0;
  }
  .add-row.simple input.link-input{
    flex:1;
    min-width:140px;
  }
  .add-row.simple .date-range-row{
    flex-basis:auto;
    width:auto;
  }
  .add-row.simple .date-range-row .date-input{
    width:128px;
    flex:none;
  }
  .add-row.simple button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .add-row.simple button:hover{ background:var(--accent-dark); }

  /* Todo */
  .todo-item{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:#fdf7f9;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
  }
  .todo-item input[type=checkbox]{
    width:18px;height:18px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
  }
  .todo-item .label{
    flex:1;
    font-size:14px;
  }
  .todo-item.done{
    background:#f7eef1;
  }
  .todo-item.done .label{
    text-decoration:line-through;
    color:var(--text-soft);
  }
  .todo-item button.edit,
  .todo-item button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:14px;
    opacity:0;
    transition:opacity .15s;
    flex-shrink:0;
  }
  .todo-item:hover button.edit,
  .todo-item:hover button.del{ opacity:1; }
  .todo-item button.edit:hover{ color:var(--accent-dark); }
  .todo-item button.del:hover{ color:var(--danger); }
  .todo-item.editing{
    background:#fff;
    border-color:var(--accent);
  }
  .todo-item .edit-input{
    flex:1;
    min-width:120px;
    font-size:14px;
    padding:6px 8px;
    border:1px solid var(--accent);
    border-radius:6px;
    outline:none;
  }
  .todo-item select.cat-select{
    width:92px;
    flex-shrink:0;
    padding:6px 8px;
    font-size:12px;
  }
  .todo-item .date-range-row .date-input{
    font-size:11.5px;
    padding:6px 8px;
  }
  .todo-item button.save{
    border:none;
    background:var(--accent-2);
    color:#fff;
    border-radius:6px;
    width:26px;height:26px;
    cursor:pointer;
    font-size:13px;
    flex-shrink:0;
    opacity:1;
  }
  .todo-item button.save:hover{ background:var(--accent-dark); }
  .todo-empty{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:24px 0;
  }
  .todo-stats{
    margin-top:12px;
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
    text-align:right;
  }

  @media (max-width:1100px){
    .week-grid{ grid-template-columns:repeat(3,1fr); }
  }
  @media (max-width:700px){
    .week-grid{ grid-template-columns:repeat(2,1fr); }
    .dashboard-stack{ padding:16px; }
    header{ padding:20px 16px 4px; }
  }
  @media (max-width:480px){
    .week-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 스케줄러</h1>
  <p id="todayLabel"></p>
</header>

<div class="dashboard-stack">

  <!-- 0. 오늘의 메모 (Quick Memo) -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>MEMO</h2>
    </div>
    <div class="add-row simple">
      <input type="text" id="memoInput" placeholder="메모를 입력하고 Enter">
      <button id="addMemoBtn">추가</button>
    </div>
    <div id="memoList"></div>
  </div>

  <!-- 1. 일일 업무 (Today's To-Do) -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>일일 업무 (Today's To-Do)</h2>
      <div class="day-nav">
        <button id="todoPrevDay" class="nav-btn" title="이전 날">‹</button>
        <button id="todoTodayBtn" class="nav-today-btn">오늘</button>
        <button id="todoNextDay" class="nav-btn" title="다음 날">›</button>
        <input type="date" id="todoDatePicker">
      </div>
    </div>
    <span class="today-date-badge" id="todoDateBadge"></span>
    <div class="add-row simple">
      <select class="cat-select" id="todoCategorySelect"></select>
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter">
      <input type="url" class="link-input" id="todoLinkInput" placeholder="링크 URL (선택)">
      <div class="date-range-row">
        <input type="date" class="date-input" id="todoStartDate">
        <span class="sep">~</span>
        <input type="date" class="date-input" id="todoEndDate">
      </div>
      <button id="addTodoBtn">추가</button>
    </div>
    <div id="todoList"></div>
    <div class="todo-stats" id="todoStats"></div>
  </div>

  <!-- 2. 주간 업무 (Weekly Tasks) - 월~금 통합 그리드 -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>주간 업무 (Weekly Tasks)</h2>
      <div class="day-nav">
        <button id="weekPrevBtn" class="nav-btn" title="이전 주">‹</button>
        <button id="weekTodayBtn" class="nav-today-btn">이번주</button>
        <button id="weekNextBtn" class="nav-btn" title="다음 주">›</button>
      </div>
    </div>
    <span class="week-range" id="weekRange"></span>
    <div class="week-grid" id="weekGrid"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="weekProgressBar" style="width:0%"></div></div>
      <div class="progress-label">
        <span>이번 주 전체 진행률</span>
        <span id="weekProgressText">0%</span>
      </div>
    </div>
  </div>

  <!-- 3. 월간 달력 -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>월간 달력</h2>
      <div class="cal-nav">
        <button id="prevMonth">‹</button>
        <span class="cal-title" id="calTitle"></span>
        <button id="nextMonth">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

</div>

<!-- 날짜별 일정 추가 모달 -->
<div class="modal-overlay" id="addTaskModal">
  <div class="modal-box">
    <h3 id="modalDateLabel"></h3>
    <input type="text" id="modalTaskInput" placeholder="일정을 입력하세요">
    <select class="cat-select" id="modalCategorySelect"></select>
    <input type="url" class="link-input" id="modalLinkInput" placeholder="링크 URL (선택)" style="width:100%;margin-top:10px;">
    <div class="date-range-row">
      <input type="date" class="date-input" id="modalStartDate">
      <span class="sep">~</span>
      <input type="date" class="date-input" id="modalEndDate">
    </div>
    <div class="modal-actions">
      <button class="delete-btn" id="modalDeleteBtn" style="display:none;">삭제</button>
      <button class="cancel-btn" id="modalCancelBtn">취소</button>
      <button class="confirm-btn" id="modalAddBtn">추가</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "scheduler_dashboard_data_v1";
  const DOW = ["일","월","화","수","목","금","토"];
  const WEEKDAYS = [
    { key:"mon", offset:1 },
    { key:"tue", offset:2 },
    { key:"wed", offset:3 },
    { key:"thu", offset:4 },
    { key:"fri", offset:5 }
  ];
  const CATEGORIES = ["SNS","디자인","서류","품의","지결","인플루언서","크리에이터","체험단","이벤트","기타"];
  const CATEGORY_COLORS = {
    "SNS":       { bg:"#e0f2fe", fg:"#0284c7" },
    "디자인":     { bg:"#f3e8ff", fg:"#9333ea" },
    "서류":       { bg:"#f1f5f9", fg:"#475569" },
    "품의":       { bg:"#fef3c7", fg:"#b45309" },
    "지결":       { bg:"#ccfbf1", fg:"#0f766e" },
    "인플루언서":  { bg:"#ffe4e6", fg:"#e11d48" },
    "크리에이터":  { bg:"#e0e7ff", fg:"#4338ca" },
    "체험단":     { bg:"#ecfccb", fg:"#4d7c0f" },
    "이벤트":     { bg:"#ffedd5", fg:"#c2410c" },
    "기타":       { bg:"#e5e7eb", fg:"#4b5563" }
  };

  function fmtDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function getWeekKey(d){
    const date = new Date(d);
    date.setHours(0,0,0,0);
    const dow = date.getDay();
    date.setDate(date.getDate() - dow);
    return fmtDate(date);
  }

  function genId(){
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadData(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    let parsed = {};
    if(raw){
      try{ parsed = JSON.parse(raw); }catch(e){ parsed = {}; }
    }

    // 통합 데이터 구조(tasks: 날짜별 업무 배열)로 일회성 마이그레이션 (구버전)
    if(!parsed.tasks && !parsed.taskList){
      parsed.tasks = {};

      if(parsed.todos){
        Object.keys(parsed.todos).forEach(dk=>{
          if(!parsed.tasks[dk]) parsed.tasks[dk] = [];
          parsed.tasks[dk].push(...parsed.todos[dk]);
        });
      }
      if(parsed.events){
        Object.keys(parsed.events).forEach(dk=>{
          if(!parsed.tasks[dk]) parsed.tasks[dk] = [];
          parsed.events[dk].forEach(txt=>{
            parsed.tasks[dk].push({ text: txt, done:false });
          });
        });
      }
      if(parsed.weekTasks){
        Object.keys(parsed.weekTasks).forEach(weekKey=>{
          const bucket = parsed.weekTasks[weekKey];
          if(!bucket || Array.isArray(bucket)) return;
          WEEKDAYS.forEach(wd=>{
            const arr = bucket[wd.key] || [];
            if(arr.length===0) return;
            const sunday = new Date(weekKey);
            const d = new Date(sunday);
            d.setDate(d.getDate() + wd.offset);
            const dk = fmtDate(d);
            if(!parsed.tasks[dk]) parsed.tasks[dk] = [];
            parsed.tasks[dk].push(...arr);
          });
        });
      }

      delete parsed.todos;
      delete parsed.events;
      delete parsed.weekTasks;
    }

    // 기간(시작일~종료일) 지원 flat 리스트(taskList)로 일회성 마이그레이션
    if(!parsed.taskList){
      parsed.taskList = [];
      if(parsed.tasks){
        Object.keys(parsed.tasks).forEach(dk=>{
          parsed.tasks[dk].forEach(t=>{
            parsed.taskList.push({
              id: genId(),
              text: t.text,
              done: !!t.done,
              category: t.category || CATEGORIES[0],
              startDate: dk,
              endDate: dk
            });
          });
        });
      }
      delete parsed.tasks;
    }

    if(!parsed.memoCards){
      parsed.memoCards = [];
      if(parsed.memos){
        Object.values(parsed.memos).forEach(txt=>{
          if(txt && txt.trim()) parsed.memoCards.push(txt.trim());
        });
      }
      delete parsed.memos;
    }
    if(!parsed.customCategories) parsed.customCategories = [];

    return parsed;
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  const data = loadData();
  saveData();

  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth(); // 0-based
  const todayKey = fmtDate(today);

  // ---------- 통합 데이터 접근 헬퍼 (taskList: 시작일~종료일을 갖는 flat 리스트) ----------
  function getTasksForDate(dateKey){
    return data.taskList.filter(t => t.startDate <= dateKey && dateKey <= t.endDate);
  }
  function findTask(id){
    return data.taskList.find(t => t.id === id);
  }
  function deleteTask(id){
    const idx = data.taskList.findIndex(t => t.id === id);
    if(idx > -1) data.taskList.splice(idx, 1);
  }
  function clampRange(start, end){
    const s = start || todayKey;
    let e = end || s;
    if(e < s) e = s;
    return { start:s, end:e };
  }
  function normalizeLink(url){
    const v = (url || "").trim();
    if(!v) return "";
    if(/^https?:\/\//i.test(v)) return v;
    return "https://" + v;
  }
  function addTask(text, category, startDate, endDate, link){
    const r = clampRange(startDate, endDate);
    data.taskList.push({
      id: genId(),
      text: text,
      done:false,
      category: category || CATEGORIES[0],
      startDate: r.start,
      endDate: r.end,
      link: normalizeLink(link)
    });
  }
  function allCategories(){
    return CATEGORIES.concat(data.customCategories);
  }
  function categoryColor(category){
    if(CATEGORY_COLORS[category]) return CATEGORY_COLORS[category];
    let hash = 0;
    for(let i=0;i<category.length;i++){ hash = category.charCodeAt(i) + ((hash<<5)-hash); }
    const hue = Math.abs(hash) % 360;
    return { bg:`hsl(${hue},70%,92%)`, fg:`hsl(${hue},55%,38%)` };
  }
  function fillCategorySelect(selectEl, selected){
    selectEl.innerHTML = "";
    allCategories().forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      selectEl.appendChild(opt);
    });
    const addOpt = document.createElement("option");
    addOpt.value = "__ADD_NEW__";
    addOpt.textContent = "+ 카테고리 추가";
    selectEl.appendChild(addOpt);

    selectEl.value = selected || CATEGORIES[0];
    selectEl.dataset.prevValue = selectEl.value;
  }
  function attachAddCategoryHandler(selectEl){
    selectEl.addEventListener("change", ()=>{
      if(selectEl.value === "__ADD_NEW__"){
        const name = prompt("추가할 카테고리 이름을 입력하세요.");
        const trimmed = (name || "").trim();
        if(trimmed){
          if(!allCategories().includes(trimmed)){
            data.customCategories.push(trimmed);
            saveData();
          }
          fillCategorySelect(selectEl, trimmed);
        }else{
          fillCategorySelect(selectEl, selectEl.dataset.prevValue || CATEGORIES[0]);
        }
      }else{
        selectEl.dataset.prevValue = selectEl.value;
      }
    });
  }
  function makeCategoryTag(category){
    const tag = document.createElement("span");
    tag.className = "cat-tag";
    tag.textContent = category || "기타";
    const c = categoryColor(category);
    tag.style.background = c.bg;
    tag.style.color = c.fg;
    return tag;
  }
  function makeLinkIcon(url){
    const a = document.createElement("a");
    a.className = "link-icon";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "🔗";
    a.title = url;
    a.addEventListener("click", e=> e.stopPropagation());
    return a;
  }
  function makeDateRangeRow(startVal, endVal){
    const wrap = document.createElement("div");
    wrap.className = "date-range-row";

    const startInput = document.createElement("input");
    startInput.type = "date";
    startInput.className = "date-input start-date";
    startInput.value = startVal;

    const sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "~";

    const endInput = document.createElement("input");
    endInput.type = "date";
    endInput.className = "date-input end-date";
    endInput.value = endVal;

    wrap.appendChild(startInput);
    wrap.appendChild(sep);
    wrap.appendChild(endInput);
    return { wrap, startInput, endInput };
  }

  // ---------- 드래그 앤 드롭 (Ctrl+드래그 = 복제, 일반 드래그 = 이동) ----------
  function moveOrCopyTask(task, newStartKey, isCopy){
    const start = new Date(task.startDate);
    const end = new Date(task.endDate);
    const durationDays = Math.round((end - start) / 86400000);
    const newStart = new Date(newStartKey);
    const newEnd = new Date(newStart);
    newEnd.setDate(newEnd.getDate() + durationDays);
    const newStartKeyFinal = fmtDate(newStart);
    const newEndKeyFinal = fmtDate(newEnd);

    if(isCopy){
      data.taskList.push({
        id: genId(),
        text: task.text,
        done:false,
        category: task.category,
        startDate: newStartKeyFinal,
        endDate: newEndKeyFinal,
        link: task.link || ""
      });
    }else{
      task.startDate = newStartKeyFinal;
      task.endDate = newEndKeyFinal;
    }
    saveData();
    renderAll();
  }
  function attachDraggable(el, task){
    el.draggable = true;
    el.addEventListener("dragstart", (e)=>{
      e.dataTransfer.setData("text/plain", task.id);
      e.dataTransfer.effectAllowed = "copyMove";
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", ()=>{
      el.classList.remove("dragging");
    });
  }
  function attachDropTarget(el, getDropDateKey){
    el.addEventListener("dragover", (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = e.ctrlKey ? "copy" : "move";
      el.classList.add("drop-hover");
    });
    el.addEventListener("dragleave", ()=>{
      el.classList.remove("drop-hover");
    });
    el.addEventListener("drop", (e)=>{
      e.preventDefault();
      el.classList.remove("drop-hover");
      const taskId = e.dataTransfer.getData("text/plain");
      const task = findTask(taskId);
      if(!task) return;
      moveOrCopyTask(task, getDropDateKey(), e.ctrlKey);
    });
  }

  // ---------- Header ----------
  document.getElementById("todayLabel").textContent =
    `오늘은 ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${DOW[today.getDay()]}요일) 입니다.`;

  const todoCategorySelect = document.getElementById("todoCategorySelect");
  fillCategorySelect(todoCategorySelect, CATEGORIES[0]);
  attachAddCategoryHandler(todoCategorySelect);

  const todoStartDate = document.getElementById("todoStartDate");
  const todoEndDate = document.getElementById("todoEndDate");
  const todoLinkInput = document.getElementById("todoLinkInput");

  // ---------- 일일 업무 날짜 네비게이션 ----------
  let viewedDate = new Date(today);
  let viewedDateKey = todayKey;
  const todoDateBadge = document.getElementById("todoDateBadge");
  const todoDatePicker = document.getElementById("todoDatePicker");
  const todoPrevDay = document.getElementById("todoPrevDay");
  const todoNextDay = document.getElementById("todoNextDay");
  const todoTodayBtn = document.getElementById("todoTodayBtn");

  function updateTodoDateUI(){
    todoDateBadge.textContent = `${viewedDate.getFullYear()}년 ${viewedDate.getMonth()+1}월 ${viewedDate.getDate()}일 ${DOW[viewedDate.getDay()]}요일`;
    todoDatePicker.value = viewedDateKey;
    todoStartDate.value = viewedDateKey;
    todoEndDate.value = viewedDateKey;
  }
  function setViewedDate(d){
    viewedDate = d;
    viewedDateKey = fmtDate(viewedDate);
    dailyEditingId = null;
    updateTodoDateUI();
    renderDaily();
  }
  todoPrevDay.addEventListener("click", ()=>{
    const d = new Date(viewedDate); d.setDate(d.getDate()-1);
    setViewedDate(d);
  });
  todoNextDay.addEventListener("click", ()=>{
    const d = new Date(viewedDate); d.setDate(d.getDate()+1);
    setViewedDate(d);
  });
  todoTodayBtn.addEventListener("click", ()=> setViewedDate(new Date(today)));
  todoDatePicker.addEventListener("change", ()=>{
    if(!todoDatePicker.value) return;
    const [y,m,d] = todoDatePicker.value.split("-").map(Number);
    setViewedDate(new Date(y, m-1, d));
  });
  updateTodoDateUI();

  // ---------- Quick Memo (날짜 무관 영구 보관, 카드형) ----------
  const memoList = document.getElementById("memoList");
  const memoInput = document.getElementById("memoInput");

  function renderMemos(){
    memoList.innerHTML = "";
    if(data.memoCards.length === 0){
      const empty = document.createElement("div");
      empty.className = "memo-empty";
      empty.textContent = "메모를 추가해보세요.";
      memoList.appendChild(empty);
      return;
    }
    data.memoCards.forEach((txt, idx)=>{
      const card = document.createElement("div");
      card.className = "memo-card";

      const span = document.createElement("div");
      span.className = "txt";
      span.textContent = txt;

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.title = "삭제";
      del.addEventListener("click", ()=>{
        data.memoCards.splice(idx, 1);
        saveData();
        renderMemos();
      });

      card.appendChild(span);
      card.appendChild(del);
      memoList.appendChild(card);
    });
  }

  function addMemo(){
    const val = memoInput.value.trim();
    if(!val) return;
    data.memoCards.push(val);
    memoInput.value = "";
    saveData();
    renderMemos();
  }
  document.getElementById("addMemoBtn").addEventListener("click", addMemo);
  memoInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addMemo(); });

  renderMemos();

  // ---------- 렌더 오케스트레이션 ----------
  function renderAll(){
    renderCalendar();
    renderWeekTasks();
    renderDaily();
  }

  // ---------- Calendar ----------
  const calGrid = document.getElementById("calGrid");
  const calTitle = document.getElementById("calTitle");

  function renderCalendar(){
    calTitle.textContent = `${calYear}년 ${calMonth+1}월`;
    calGrid.innerHTML = "";

    DOW.forEach(d=>{
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const firstDay = new Date(calYear, calMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const el = document.createElement("div");
      el.className = "cal-day empty";
      calGrid.appendChild(el);
    }

    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(calYear, calMonth, day);
      const key = fmtDate(dateObj);
      const isToday = key === todayKey;
      const el = document.createElement("div");
      el.className = "cal-day";
      if(isToday) el.classList.add("today");
      attachDropTarget(el, ()=> key);

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = day;
      el.appendChild(num);

      const addBtn = document.createElement("button");
      addBtn.className = "day-add-btn";
      addBtn.type = "button";
      addBtn.textContent = "+";
      addBtn.title = "일정 추가";
      addBtn.addEventListener("click", ()=> openModal(key, dateObj));
      el.appendChild(addBtn);

      const dayTasks = getTasksForDate(key);
      const multiDay = dayTasks.filter(t => t.startDate !== t.endDate);
      const singleDay = dayTasks.filter(t => t.startDate === t.endDate);

      if(multiDay.length > 0){
        const barsWrap = document.createElement("div");
        barsWrap.className = "cal-bars";

        multiDay.forEach(t=>{
          const isRowStart = dateObj.getDay() === 0;
          const isRowEnd = dateObj.getDay() === 6;
          const isTaskStart = key === t.startDate;
          const isTaskEnd = key === t.endDate;
          const segStart = isTaskStart || isRowStart;
          const segEnd = isTaskEnd || isRowEnd;

          const bar = document.createElement("div");
          bar.className = "cal-bar" + (t.done ? " done" : "") + (segStart ? " seg-start" : "") + (segEnd ? " seg-end" : "");
          const c = isToday ? { bg:"rgba(255,255,255,0.35)", fg:"#fff" } : categoryColor(t.category);
          bar.style.background = c.bg;
          bar.style.color = c.fg;
          bar.addEventListener("click", ()=> openEditModal(t));
          attachDraggable(bar, t);

          if(segStart){
            const txt = document.createElement("span");
            txt.className = "txt";
            txt.textContent = t.text;
            bar.appendChild(txt);
            if(t.link){
              const link = makeLinkIcon(t.link);
              link.style.fontSize = "8px";
              bar.appendChild(link);
            }
          }

          if(isTaskStart){
            const del = document.createElement("button");
            del.className = "cal-bar-del";
            del.type = "button";
            del.textContent = "×";
            del.addEventListener("click", (e)=>{
              e.stopPropagation();
              deleteTask(t.id);
              saveData();
              renderAll();
            });
            bar.appendChild(del);
          }

          barsWrap.appendChild(bar);
        });

        el.appendChild(barsWrap);
      }

      if(singleDay.length > 0){
        const badgeWrap = document.createElement("div");
        badgeWrap.className = "day-badges";
        singleDay.forEach(t=>{
          const badge = document.createElement("div");
          badge.className = "day-badge" + (t.done ? " done" : "");
          const c = isToday ? { bg:"rgba(255,255,255,0.28)", fg:"#fff" } : categoryColor(t.category);
          badge.style.background = c.bg;
          badge.style.color = c.fg;
          badge.addEventListener("click", ()=> openEditModal(t));
          attachDraggable(badge, t);

          const txt = document.createElement("span");
          txt.className = "txt";
          txt.textContent = t.text;
          badge.appendChild(txt);

          if(t.link){
            const link = makeLinkIcon(t.link);
            link.style.fontSize = "8px";
            badge.appendChild(link);
          }

          const del = document.createElement("button");
          del.className = "day-badge-del";
          del.type = "button";
          del.textContent = "×";
          del.addEventListener("click", (e)=>{
            e.stopPropagation();
            deleteTask(t.id);
            saveData();
            renderAll();
          });
          badge.appendChild(del);

          badgeWrap.appendChild(badge);
        });
        el.appendChild(badgeWrap);
      }

      calGrid.appendChild(el);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });

  // ---------- 날짜별 일정 추가 모달 (달력 + 주간 업무 공용) ----------
  const modalOverlay = document.getElementById("addTaskModal");
  const modalDateLabel = document.getElementById("modalDateLabel");
  const modalTaskInput = document.getElementById("modalTaskInput");
  const modalCategorySelect = document.getElementById("modalCategorySelect");
  const modalLinkInput = document.getElementById("modalLinkInput");
  const modalStartDate = document.getElementById("modalStartDate");
  const modalEndDate = document.getElementById("modalEndDate");
  const modalAddBtn = document.getElementById("modalAddBtn");
  const modalDeleteBtn = document.getElementById("modalDeleteBtn");
  attachAddCategoryHandler(modalCategorySelect);
  let modalDateKey = null;
  let modalEditId = null;

  function openModal(dateKey, dateObj){
    modalDateKey = dateKey;
    modalEditId = null;
    modalDateLabel.textContent = `${dateObj.getFullYear()}년 ${dateObj.getMonth()+1}월 ${dateObj.getDate()}일 (${DOW[dateObj.getDay()]}) 업무 추가`;
    modalTaskInput.value = "";
    modalLinkInput.value = "";
    fillCategorySelect(modalCategorySelect, CATEGORIES[0]);
    modalStartDate.value = dateKey;
    modalEndDate.value = dateKey;
    modalAddBtn.textContent = "추가";
    modalDeleteBtn.style.display = "none";
    modalOverlay.classList.add("open");
    modalTaskInput.focus();
  }
  function openEditModal(task){
    modalDateKey = null;
    modalEditId = task.id;
    modalDateLabel.textContent = "업무 수정";
    modalTaskInput.value = task.text;
    modalLinkInput.value = task.link || "";
    fillCategorySelect(modalCategorySelect, task.category);
    modalStartDate.value = task.startDate;
    modalEndDate.value = task.endDate;
    modalAddBtn.textContent = "저장";
    modalDeleteBtn.style.display = "inline-block";
    modalOverlay.classList.add("open");
    modalTaskInput.focus();
  }
  function closeModal(){
    modalOverlay.classList.remove("open");
    modalDateKey = null;
    modalEditId = null;
  }
  function submitModal(){
    const val = modalTaskInput.value.trim();
    if(!val) return;
    if(modalEditId){
      const task = findTask(modalEditId);
      if(task){
        const r = clampRange(modalStartDate.value, modalEndDate.value);
        task.text = val;
        task.category = modalCategorySelect.value;
        task.startDate = r.start;
        task.endDate = r.end;
        task.link = normalizeLink(modalLinkInput.value);
      }
    }else{
      if(!modalDateKey) return;
      addTask(val, modalCategorySelect.value, modalStartDate.value, modalEndDate.value, modalLinkInput.value);
    }
    saveData();
    closeModal();
    renderAll();
  }
  modalAddBtn.addEventListener("click", submitModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  modalDeleteBtn.addEventListener("click", ()=>{
    if(modalEditId){
      deleteTask(modalEditId);
      saveData();
    }
    closeModal();
    renderAll();
  });
  modalTaskInput.addEventListener("keydown", e=>{
    if(e.key === "Enter") submitModal();
    if(e.key === "Escape") closeModal();
  });
  modalOverlay.addEventListener("click", e=>{
    if(e.target === modalOverlay) closeModal();
  });

  // ---------- Weekly tasks (통합 그리드: 헤더 + 기간형 바 + 단일 업무 카드) ----------
  let viewedWeekKey = getWeekKey(today);
  let weekEditing = null; // { id, colKey } | null
  const weekGrid = document.getElementById("weekGrid");
  const weekProgressBar = document.getElementById("weekProgressBar");
  const weekProgressText = document.getElementById("weekProgressText");
  const weekRangeLabel = document.getElementById("weekRange");
  const weekPrevBtn = document.getElementById("weekPrevBtn");
  const weekNextBtn = document.getElementById("weekNextBtn");
  const weekTodayBtn = document.getElementById("weekTodayBtn");

  function setViewedWeek(newWeekKey){
    viewedWeekKey = newWeekKey;
    weekEditing = null;
    renderWeekRange();
    renderWeekTasks();
  }
  weekPrevBtn.addEventListener("click", ()=>{
    const d = new Date(viewedWeekKey);
    d.setDate(d.getDate() - 7);
    setViewedWeek(fmtDate(d));
  });
  weekNextBtn.addEventListener("click", ()=>{
    const d = new Date(viewedWeekKey);
    d.setDate(d.getDate() + 7);
    setViewedWeek(fmtDate(d));
  });
  weekTodayBtn.addEventListener("click", ()=> setViewedWeek(getWeekKey(today)));

  function renderWeekRange(){
    const start = new Date(viewedWeekKey);
    const end = new Date(start);
    end.setDate(end.getDate()+6);
    const fmt = d => `${d.getMonth()+1}.${d.getDate()}`;
    weekRangeLabel.textContent = `${fmt(start)} - ${fmt(end)}`;
  }

  function saveWeekEdit(id, newVal, newCategory, newStart, newEnd, newLink){
    const val = newVal.trim();
    if(!val) return;
    const task = findTask(id);
    if(!task) return;
    const r = clampRange(newStart, newEnd);
    task.text = val;
    task.category = newCategory || CATEGORIES[0];
    task.startDate = r.start;
    task.endDate = r.end;
    task.link = normalizeLink(newLink);
    weekEditing = null;
    saveData();
    renderAll();
  }

  function getWeekTimelineItems(){
    const sundayOfWeek = new Date(viewedWeekKey);
    const weekdayKeys = WEEKDAYS.map(wd=>{
      const d = new Date(sundayOfWeek);
      d.setDate(d.getDate() + wd.offset);
      return fmtDate(d);
    });
    const weekMonKey = weekdayKeys[0], weekFriKey = weekdayKeys[4];

    const items = data.taskList
      .filter(t => t.startDate !== t.endDate)
      .filter(t => t.startDate <= weekFriKey && t.endDate >= weekMonKey)
      .map(t=>{
        const dispStart = t.startDate < weekMonKey ? weekMonKey : t.startDate;
        const dispEnd = t.endDate > weekFriKey ? weekFriKey : t.endDate;
        return {
          task: t,
          startIdx: weekdayKeys.indexOf(dispStart),
          endIdx: weekdayKeys.indexOf(dispEnd),
          capStart: dispStart === t.startDate,
          capEnd: dispEnd === t.endDate
        };
      })
      .sort((a,b)=> a.startIdx - b.startIdx || a.endIdx - b.endIdx);

    const laneEnds = [];
    items.forEach(it=>{
      let lane = laneEnds.findIndex(end => end < it.startIdx);
      if(lane === -1){ lane = laneEnds.length; laneEnds.push(it.endIdx); }
      else laneEnds[lane] = it.endIdx;
      it.lane = lane;
    });
    return items;
  }

  function renderWeekTasks(){
    weekGrid.innerHTML = "";
    const sundayOfWeek = new Date(viewedWeekKey);
    let totalAll = 0, doneAll = 0;

    const timelineItems = getWeekTimelineItems();
    timelineItems.forEach(it=>{
      totalAll++;
      if(it.task.done) doneAll++;
    });
    const laneCount = timelineItems.length ? Math.max(...timelineItems.map(it=>it.lane)) + 1 : 0;
    const cardsRow = laneCount + 2;

    const colKeys = [];
    const colDates = [];

    WEEKDAYS.forEach((wd, i)=>{
      const colDate = new Date(sundayOfWeek);
      colDate.setDate(colDate.getDate() + wd.offset);
      const colKey = fmtDate(colDate);
      colKeys.push(colKey);
      colDates.push(colDate);
      const isToday = colKey === todayKey;

      const header = document.createElement("div");
      header.className = "week-grid-header" + (isToday ? " today-col" : "");
      header.style.gridColumn = String(i + 1);
      header.style.gridRow = "1";

      const dayLabel = document.createElement("span");
      dayLabel.className = "day-label";
      dayLabel.textContent = `${DOW[colDate.getDay()]}(${colDate.getMonth()+1}.${colDate.getDate()})`;
      header.appendChild(dayLabel);

      const addBtn = document.createElement("button");
      addBtn.className = "week-add-btn";
      addBtn.type = "button";
      addBtn.textContent = "+";
      addBtn.title = "업무 추가";
      addBtn.addEventListener("click", ()=> openModal(colKey, colDate));
      header.appendChild(addBtn);

      weekGrid.appendChild(header);
    });

    timelineItems.forEach(it=>{
      const t = it.task;
      const bar = document.createElement("div");
      bar.className = "week-grid-bar" + (t.done ? " done" : "") + (!it.capStart ? " trunc-start" : "") + (!it.capEnd ? " trunc-end" : "");
      bar.style.gridColumn = `${it.startIdx + 1} / ${it.endIdx + 2}`;
      bar.style.gridRow = String(it.lane + 2);
      const c = categoryColor(t.category);
      bar.style.background = c.bg;
      bar.style.color = c.fg;
      attachDraggable(bar, t);

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.title = "완료 체크";
      cb.checked = t.done;
      cb.addEventListener("click", e=> e.stopPropagation());
      cb.addEventListener("change", ()=>{
        t.done = cb.checked;
        saveData();
        renderAll();
      });
      bar.appendChild(cb);

      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = t.text;
      bar.appendChild(txt);

      if(t.link) bar.appendChild(makeLinkIcon(t.link));

      const editBtn = document.createElement("button");
      editBtn.className = "tl-edit";
      editBtn.type = "button";
      editBtn.textContent = "✎";
      editBtn.title = "수정";
      editBtn.addEventListener("click", ()=> openEditModal(t));
      bar.appendChild(editBtn);

      weekGrid.appendChild(bar);
    });

    colKeys.forEach((colKey, i)=>{
      const isToday = colKey === todayKey;
      const tasks = getTasksForDate(colKey).filter(t => t.startDate === t.endDate);

      const cardsWrap = document.createElement("div");
      cardsWrap.className = "week-grid-cards" + (isToday ? " today-col" : "");
      cardsWrap.style.gridColumn = String(i + 1);
      cardsWrap.style.gridRow = String(cardsRow);
      attachDropTarget(cardsWrap, ()=> colKey);

      if(tasks.length === 0){
        const empty = document.createElement("div");
        empty.className = "week-col-empty";
        empty.textContent = "업무 없음";
        cardsWrap.appendChild(empty);
      }

      tasks.forEach(task=>{
        totalAll++;
        if(task.done) doneAll++;

        const isEditing = weekEditing && weekEditing.id === task.id && weekEditing.colKey === colKey;
        const row = document.createElement("div");
        row.className = "week-task-item" + (task.done ? " done" : "") + (isEditing ? " editing" : "");

        if(isEditing){
          const catSel = document.createElement("select");
          catSel.className = "cat-select";
          fillCategorySelect(catSel, task.category);
          attachAddCategoryHandler(catSel);
          row.appendChild(catSel);

          const textInput = document.createElement("input");
          textInput.type = "text";
          textInput.className = "edit-input";
          textInput.value = task.text;
          row.appendChild(textInput);

          const linkInput = document.createElement("input");
          linkInput.type = "url";
          linkInput.className = "link-input";
          linkInput.placeholder = "링크 URL (선택)";
          linkInput.value = task.link || "";
          linkInput.style.width = "100%";
          row.appendChild(linkInput);

          const dr = makeDateRangeRow(task.startDate, task.endDate);
          row.appendChild(dr.wrap);

          const actions = document.createElement("div");
          actions.className = "edit-actions";

          const saveBtn = document.createElement("button");
          saveBtn.className = "save";
          saveBtn.textContent = "✓";
          saveBtn.title = "저장";
          saveBtn.addEventListener("click", ()=> saveWeekEdit(task.id, textInput.value, catSel.value, dr.startInput.value, dr.endInput.value, linkInput.value));
          actions.appendChild(saveBtn);

          const delBtn = document.createElement("button");
          delBtn.className = "del";
          delBtn.style.opacity = "1";
          delBtn.textContent = "✕";
          delBtn.title = "삭제";
          delBtn.addEventListener("click", ()=>{
            deleteTask(task.id);
            weekEditing = null;
            saveData();
            renderAll();
          });
          actions.appendChild(delBtn);

          row.appendChild(actions);
          cardsWrap.appendChild(row);

          textInput.addEventListener("keydown", e=>{
            if(e.key === "Enter") saveWeekEdit(task.id, textInput.value, catSel.value, dr.startInput.value, dr.endInput.value, linkInput.value);
            if(e.key === "Escape"){ weekEditing = null; renderWeekTasks(); }
          });
          textInput.focus();
          textInput.select();
          return;
        }

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;
        cb.addEventListener("change", ()=>{
          task.done = cb.checked;
          saveData();
          renderAll();
        });

        const tag = makeCategoryTag(task.category);

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = task.text;

        const editBtn = document.createElement("button");
        editBtn.className = "edit";
        editBtn.textContent = "✎";
        editBtn.title = "수정";
        editBtn.addEventListener("click", ()=>{
          weekEditing = { id: task.id, colKey };
          renderWeekTasks();
        });

        row.appendChild(cb);
        row.appendChild(tag);
        row.appendChild(label);
        if(task.link) row.appendChild(makeLinkIcon(task.link));
        row.appendChild(editBtn);
        attachDraggable(row, task);
        cardsWrap.appendChild(row);
      });

      weekGrid.appendChild(cardsWrap);
    });

    const pct = totalAll === 0 ? 0 : Math.round((doneAll/totalAll)*100);
    weekProgressBar.style.width = pct + "%";
    weekProgressText.textContent = `${pct}% (${doneAll}/${totalAll})`;
  }

  // ---------- Daily To-Do ----------
  const todoList = document.getElementById("todoList");
  const todoInput = document.getElementById("todoInput");
  const todoStats = document.getElementById("todoStats");
  let dailyEditingId = null;
  attachDropTarget(todoList, ()=> viewedDateKey);

  function saveEdit(id, newVal, newCategory, newStart, newEnd, newLink){
    const val = newVal.trim();
    if(!val) return;
    const task = findTask(id);
    if(!task) return;
    const r = clampRange(newStart, newEnd);
    task.text = val;
    task.category = newCategory || CATEGORIES[0];
    task.startDate = r.start;
    task.endDate = r.end;
    task.link = normalizeLink(newLink);
    dailyEditingId = null;
    saveData();
    renderAll();
  }

  function renderDaily(){
    const tasks = getTasksForDate(viewedDateKey);
    todoList.innerHTML = "";

    if(tasks.length === 0){
      const empty = document.createElement("div");
      empty.className = "todo-empty";
      empty.textContent = "등록된 할 일이 없습니다.";
      todoList.appendChild(empty);
      todoStats.textContent = "";
      return;
    }

    tasks.forEach(todo=>{
      const row = document.createElement("div");
      row.className = "todo-item" + (todo.done ? " done" : "");

      if(dailyEditingId === todo.id){
        row.classList.add("editing");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = todo.done;
        cb.disabled = true;
        row.appendChild(cb);

        const editCategorySelect = document.createElement("select");
        editCategorySelect.className = "cat-select";
        fillCategorySelect(editCategorySelect, todo.category);
        attachAddCategoryHandler(editCategorySelect);
        row.appendChild(editCategorySelect);

        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "edit-input";
        editInput.value = todo.text;
        row.appendChild(editInput);

        const saveBtn = document.createElement("button");
        saveBtn.className = "save";
        saveBtn.textContent = "✓";
        saveBtn.title = "저장";
        row.appendChild(saveBtn);

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "del";
        cancelBtn.style.opacity = "1";
        cancelBtn.textContent = "✕";
        cancelBtn.title = "취소";
        cancelBtn.addEventListener("click", ()=>{
          dailyEditingId = null;
          renderDaily();
        });
        row.appendChild(cancelBtn);

        const linkInput = document.createElement("input");
        linkInput.type = "url";
        linkInput.className = "link-input";
        linkInput.placeholder = "링크 URL (선택)";
        linkInput.value = todo.link || "";
        linkInput.style.width = "100%";
        row.appendChild(linkInput);

        const dr = makeDateRangeRow(todo.startDate, todo.endDate);
        row.appendChild(dr.wrap);

        saveBtn.addEventListener("click", ()=> saveEdit(todo.id, editInput.value, editCategorySelect.value, dr.startInput.value, dr.endInput.value, linkInput.value));

        todoList.appendChild(row);

        editInput.addEventListener("keydown", e=>{
          if(e.key === "Enter") saveEdit(todo.id, editInput.value, editCategorySelect.value, dr.startInput.value, dr.endInput.value, linkInput.value);
          if(e.key === "Escape"){ dailyEditingId = null; renderDaily(); }
        });
        editInput.focus();
        editInput.select();
        return;
      }

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = todo.done;
      cb.addEventListener("change", ()=>{
        todo.done = cb.checked;
        saveData();
        renderAll();
      });

      const tag = makeCategoryTag(todo.category);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = todo.text;

      const editBtn = document.createElement("button");
      editBtn.className = "edit";
      editBtn.textContent = "✎";
      editBtn.title = "수정";
      editBtn.addEventListener("click", ()=>{
        dailyEditingId = todo.id;
        renderDaily();
      });

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.title = "삭제";
      del.addEventListener("click", ()=>{
        deleteTask(todo.id);
        if(dailyEditingId === todo.id) dailyEditingId = null;
        saveData();
        renderAll();
      });

      row.appendChild(cb);
      row.appendChild(tag);
      row.appendChild(label);
      if(todo.link) row.appendChild(makeLinkIcon(todo.link));
      row.appendChild(editBtn);
      row.appendChild(del);
      attachDraggable(row, todo);
      todoList.appendChild(row);
    });

    const total = tasks.length;
    const doneCount = tasks.filter(t=>t.done).length;
    todoStats.textContent = `완료 ${doneCount} / 전체 ${total}`;
  }

  function addTodo(){
    const val = todoInput.value.trim();
    if(!val) return;
    addTask(val, todoCategorySelect.value, todoStartDate.value, todoEndDate.value, todoLinkInput.value);
    todoInput.value = "";
    todoLinkInput.value = "";
    todoStartDate.value = viewedDateKey;
    todoEndDate.value = viewedDateKey;
    saveData();
    renderAll();
  }
  document.getElementById("addTodoBtn").addEventListener("click", addTodo);
  todoInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addTodo(); });

  // ---------- Init ----------
  renderWeekRange();
  renderAll();

})();
</script>
</body>
</html>
