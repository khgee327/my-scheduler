<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스케줄러 대시보드</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --border:#e7eaf3;
    --text:#1f2433;
    --text-soft:#6b7280;
    --accent:#6366f1;
    --accent-soft:#eef0fe;
    --accent-2:#22c55e;
    --danger:#ef4444;
    --danger-soft:#fee2e2;
    --shadow:0 4px 16px rgba(31,36,51,0.06);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:28px 40px 8px;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
  }
  header p{
    margin:6px 0 0;
    color:var(--text-soft);
    font-size:14px;
  }
  .dashboard-stack{
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:20px 40px 40px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
  }
  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .card-header h2{
    font-size:16px;
    font-weight:700;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-header h2 .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }

  /* Calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cal-nav button{
    border:none;
    background:var(--accent-soft);
    color:var(--accent);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
  }
  .cal-nav button:hover{ background:#e0e2fc; }
  .cal-title{
    font-weight:700;
    font-size:15px;
    min-width:90px;
    text-align:center;
  }
  .cal-body{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:24px;
    align-items:start;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-grid .dow{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--text-soft);
    padding-bottom:6px;
  }
  .cal-day{
    position:relative;
    min-height:64px;
    border-radius:10px;
    padding:6px 6px;
    background:#fafbfe;
    border:1px solid transparent;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .cal-day:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .cal-day.empty{
    background:transparent;
    cursor:default;
  }
  .cal-day.empty:hover{
    border-color:transparent;
    background:transparent;
  }
  .cal-day .num{
    font-size:12px;
    font-weight:600;
    color:var(--text);
  }
  .cal-day.today{
    background:var(--accent);
  }
  .cal-day.today .num{
    color:#fff;
    font-weight:800;
  }
  .cal-day .evt-dot{
    position:absolute;
    bottom:6px;
    left:6px;
    display:flex;
    gap:3px;
  }
  .cal-day .evt-dot span{
    width:5px;height:5px;border-radius:50%;
    background:var(--accent-2);
  }
  .cal-day.today .evt-dot span{
    background:#fff;
  }
  .cal-day .evt-count{
    position:absolute;
    top:4px;
    right:6px;
    font-size:9px;
    background:var(--accent-2);
    color:#fff;
    border-radius:6px;
    padding:1px 5px;
    font-weight:700;
  }

  /* Selected day panel */
  .day-panel h3{
    margin:0 0 10px;
    font-size:14px;
    font-weight:700;
    color:var(--text);
  }
  .day-panel .add-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .day-panel input[type=text]{
    flex:1;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    outline:none;
  }
  .day-panel input[type=text]:focus{
    border-color:var(--accent);
  }
  .day-panel button.add-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .day-panel button.add-btn:hover{ background:#4f46e5; }
  .evt-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:220px;
    overflow-y:auto;
  }
  .evt-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fafbfe;
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 10px;
    font-size:13px;
  }
  .evt-list li span.txt{ flex:1; }
  .evt-list li button{
    border:none;
    background:transparent;
    color:var(--danger);
    cursor:pointer;
    font-size:13px;
    padding:0 4px;
  }
  .evt-list .empty-msg{
    color:var(--text-soft);
    font-size:12px;
    padding:8px 0;
  }

  /* Weekly tasks (Mon-Fri columns) */
  .week-range{
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
  }
  .week-cols-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  .week-col{
    background:#fafbfe;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    min-height:180px;
  }
  .week-col.today-col{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .week-col-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px dashed var(--border);
  }
  .week-col-header .day-name{
    font-size:13px;
    font-weight:700;
  }
  .week-col-header .day-date{
    font-size:11px;
    color:var(--text-soft);
    font-weight:600;
  }
  .week-col-tasks{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
    margin-bottom:10px;
  }
  .week-task-item{
    display:flex;
    align-items:flex-start;
    gap:6px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
  }
  .week-col.today-col .week-task-item{
    background:#fff;
  }
  .week-task-item input[type=checkbox]{
    width:15px;height:15px;
    margin-top:2px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
  }
  .week-task-item .label{
    flex:1;
    font-size:12.5px;
    line-height:1.4;
    word-break:break-word;
  }
  .week-task-item.done .label{
    text-decoration:line-through;
    color:var(--text-soft);
  }
  .week-task-item button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:11px;
    padding:0 2px;
    flex-shrink:0;
  }
  .week-task-item button.del:hover{ color:var(--danger); }
  .week-col-empty{
    color:var(--text-soft);
    font-size:11.5px;
    text-align:center;
    padding:10px 0;
  }
  .week-col-add input{
    width:100%;
    font-size:12px;
    padding:7px 8px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
  }
  .week-col-add input:focus{ border-color:var(--accent); }

  .progress-wrap{
    margin-top:16px;
  }
  .progress-bar{
    height:8px;
    background:var(--accent-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    background:linear-gradient(90deg,var(--accent),#8b5cf6);
    border-radius:999px;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-soft);
    margin-top:6px;
    font-weight:600;
  }

  .add-row.simple{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .add-row.simple input{
    flex:1;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    outline:none;
  }
  .add-row.simple input:focus{ border-color:var(--accent); }
  .add-row.simple button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .add-row.simple button:hover{ background:#4f46e5; }

  /* Todo */
  .todo-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:#fafbfe;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
  }
  .todo-item input[type=checkbox]{
    width:18px;height:18px;
    accent-color:var(--accent-2);
    cursor:pointer;
    flex-shrink:0;
  }
  .todo-item .label{
    flex:1;
    font-size:14px;
  }
  .todo-item.done{
    background:#f6f7fb;
  }
  .todo-item.done .label{
    text-decoration:line-through;
    color:var(--text-soft);
  }
  .todo-item button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:14px;
  }
  .todo-item button.del:hover{ color:var(--danger); }
  .todo-empty{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:24px 0;
  }
  .todo-stats{
    margin-top:12px;
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
    text-align:right;
  }

  @media (max-width:1100px){
    .week-cols-grid{ grid-template-columns:repeat(3,1fr); }
    .cal-body{ grid-template-columns:1fr; }
  }
  @media (max-width:700px){
    .week-cols-grid{ grid-template-columns:repeat(2,1fr); }
    .dashboard-stack{ padding:16px; }
    header{ padding:20px 16px 4px; }
  }
  @media (max-width:480px){
    .week-cols-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 스케줄러 대시보드</h1>
  <p id="todayLabel"></p>
</header>

<div class="dashboard-stack">

  <!-- 1. 일일 업무 (Today's To-Do) -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>일일 업무 (Today's To-Do)</h2>
    </div>
    <div class="add-row simple">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter">
      <button id="addTodoBtn">추가</button>
    </div>
    <div id="todoList"></div>
    <div class="todo-stats" id="todoStats"></div>
  </div>

  <!-- 2. 주간 업무 (Weekly Tasks) - 월~금 5칼럼 -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>주간 업무 (Weekly Tasks)</h2>
      <span class="week-range" id="weekRange"></span>
    </div>
    <div class="week-cols-grid" id="weekColsGrid"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="weekProgressBar" style="width:0%"></div></div>
      <div class="progress-label">
        <span>이번 주 전체 진행률</span>
        <span id="weekProgressText">0%</span>
      </div>
    </div>
  </div>

  <!-- 3. 월간 달력 -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>월간 달력</h2>
      <div class="cal-nav">
        <button id="prevMonth">‹</button>
        <span class="cal-title" id="calTitle"></span>
        <button id="nextMonth">›</button>
      </div>
    </div>
    <div class="cal-body">
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-panel">
        <h3 id="selectedDateLabel">날짜를 선택하세요</h3>
        <div class="add-row">
          <input type="text" id="eventInput" placeholder="일정을 입력하세요">
          <button class="add-btn" id="addEventBtn">추가</button>
        </div>
        <ul class="evt-list" id="eventList"></ul>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "scheduler_dashboard_data_v1";
  const DOW = ["일","월","화","수","목","금","토"];
  const WEEKDAYS = [
    { key:"mon", name:"월요일", offset:1 },
    { key:"tue", name:"화요일", offset:2 },
    { key:"wed", name:"수요일", offset:3 },
    { key:"thu", name:"목요일", offset:4 },
    { key:"fri", name:"금요일", offset:5 }
  ];

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { events:{}, weekTasks:{}, todos:{} };
  }
  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  const data = loadData();
  if(!data.events) data.events = {};
  if(!data.weekTasks) data.weekTasks = {};
  if(!data.todos) data.todos = {};

  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth(); // 0-based
  let selectedDateKey = fmtDate(today);

  function fmtDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function getWeekKey(d){
    // ISO-like week key based on the Sunday of that week
    const date = new Date(d);
    date.setHours(0,0,0,0);
    const dow = date.getDay();
    date.setDate(date.getDate() - dow);
    return fmtDate(date);
  }

  // ---------- Header ----------
  document.getElementById("todayLabel").textContent =
    `오늘은 ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${DOW[today.getDay()]}요일) 입니다.`;

  // ---------- Calendar ----------
  const calGrid = document.getElementById("calGrid");
  const calTitle = document.getElementById("calTitle");

  function renderCalendar(){
    calTitle.textContent = `${calYear}년 ${calMonth+1}월`;
    calGrid.innerHTML = "";

    DOW.forEach(d=>{
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const firstDay = new Date(calYear, calMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const el = document.createElement("div");
      el.className = "cal-day empty";
      calGrid.appendChild(el);
    }

    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(calYear, calMonth, day);
      const key = fmtDate(dateObj);
      const el = document.createElement("div");
      el.className = "cal-day";
      if(key === fmtDate(today)) el.classList.add("today");
      if(key === selectedDateKey) el.style.outline = "2px solid " + (key===fmtDate(today) ? "#4f46e5" : "#6366f1");

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = day;
      el.appendChild(num);

      const evts = data.events[key] || [];
      if(evts.length > 0){
        const dots = document.createElement("div");
        dots.className = "evt-dot";
        const maxDots = Math.min(evts.length, 3);
        for(let i=0;i<maxDots;i++){
          const dot = document.createElement("span");
          dots.appendChild(dot);
        }
        el.appendChild(dots);

        const countBadge = document.createElement("div");
        countBadge.className = "evt-count";
        countBadge.textContent = evts.length;
        el.appendChild(countBadge);
      }

      el.addEventListener("click", ()=>{
        selectedDateKey = key;
        renderCalendar();
        renderEventPanel();
      });

      calGrid.appendChild(el);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });

  // ---------- Event panel ----------
  const selectedDateLabel = document.getElementById("selectedDateLabel");
  const eventList = document.getElementById("eventList");
  const eventInput = document.getElementById("eventInput");

  function renderEventPanel(){
    const [y,m,d] = selectedDateKey.split("-").map(Number);
    const dObj = new Date(y, m-1, d);
    selectedDateLabel.textContent = `${y}년 ${m}월 ${d}일 (${DOW[dObj.getDay()]}) 일정`;

    const evts = data.events[selectedDateKey] || [];
    eventList.innerHTML = "";
    if(evts.length === 0){
      const li = document.createElement("li");
      li.className = "empty-msg";
      li.textContent = "등록된 일정이 없습니다.";
      li.style.listStyle = "none";
      li.style.border = "none";
      li.style.background = "transparent";
      eventList.appendChild(li);
      return;
    }
    evts.forEach((evt, idx)=>{
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.className = "txt";
      span.textContent = evt;
      const btn = document.createElement("button");
      btn.textContent = "✕";
      btn.addEventListener("click", ()=>{
        data.events[selectedDateKey].splice(idx,1);
        if(data.events[selectedDateKey].length===0) delete data.events[selectedDateKey];
        saveData();
        renderEventPanel();
        renderCalendar();
      });
      li.appendChild(span);
      li.appendChild(btn);
      eventList.appendChild(li);
    });
  }

  function addEvent(){
    const val = eventInput.value.trim();
    if(!val) return;
    if(!data.events[selectedDateKey]) data.events[selectedDateKey] = [];
    data.events[selectedDateKey].push(val);
    eventInput.value = "";
    saveData();
    renderEventPanel();
    renderCalendar();
  }
  document.getElementById("addEventBtn").addEventListener("click", addEvent);
  eventInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addEvent(); });

  // ---------- Weekly tasks (Mon-Fri columns) ----------
  const weekKey = getWeekKey(today);
  if(!data.weekTasks[weekKey] || Array.isArray(data.weekTasks[weekKey])){
    data.weekTasks[weekKey] = { mon:[], tue:[], wed:[], thu:[], fri:[] };
  }
  const weekBucket = data.weekTasks[weekKey];
  WEEKDAYS.forEach(wd=>{ if(!weekBucket[wd.key]) weekBucket[wd.key] = []; });

  const weekColsGrid = document.getElementById("weekColsGrid");
  const weekProgressBar = document.getElementById("weekProgressBar");
  const weekProgressText = document.getElementById("weekProgressText");
  const weekRangeLabel = document.getElementById("weekRange");

  function renderWeekRange(){
    const start = new Date(weekKey);
    const end = new Date(start);
    end.setDate(end.getDate()+6);
    const fmt = d => `${d.getMonth()+1}.${d.getDate()}`;
    weekRangeLabel.textContent = `${fmt(start)} - ${fmt(end)}`;
  }

  function renderWeekTasks(){
    weekColsGrid.innerHTML = "";
    const sundayOfWeek = new Date(weekKey);
    let totalAll = 0, doneAll = 0;

    WEEKDAYS.forEach(wd=>{
      const tasks = weekBucket[wd.key];
      const colDate = new Date(sundayOfWeek);
      colDate.setDate(colDate.getDate() + wd.offset);
      const colKey = fmtDate(colDate);
      const isToday = colKey === fmtDate(today);

      const col = document.createElement("div");
      col.className = "week-col" + (isToday ? " today-col" : "");

      const header = document.createElement("div");
      header.className = "week-col-header";
      const dayName = document.createElement("span");
      dayName.className = "day-name";
      dayName.textContent = wd.name;
      const dayDate = document.createElement("span");
      dayDate.className = "day-date";
      dayDate.textContent = `${colDate.getMonth()+1}.${colDate.getDate()}`;
      header.appendChild(dayName);
      header.appendChild(dayDate);
      col.appendChild(header);

      const tasksWrap = document.createElement("div");
      tasksWrap.className = "week-col-tasks";

      if(tasks.length === 0){
        const empty = document.createElement("div");
        empty.className = "week-col-empty";
        empty.textContent = "업무 없음";
        tasksWrap.appendChild(empty);
      }

      tasks.forEach((task, idx)=>{
        totalAll++;
        if(task.done) doneAll++;

        const row = document.createElement("div");
        row.className = "week-task-item" + (task.done ? " done" : "");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;
        cb.addEventListener("change", ()=>{
          task.done = cb.checked;
          saveData();
          renderWeekTasks();
        });

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = task.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.addEventListener("click", ()=>{
          tasks.splice(idx,1);
          saveData();
          renderWeekTasks();
        });

        row.appendChild(cb);
        row.appendChild(label);
        row.appendChild(del);
        tasksWrap.appendChild(row);
      });

      col.appendChild(tasksWrap);

      const addWrap = document.createElement("div");
      addWrap.className = "week-col-add";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "+ 업무 추가";
      input.addEventListener("keydown", e=>{
        if(e.key === "Enter"){
          const val = input.value.trim();
          if(!val) return;
          tasks.push({ text: val, done:false });
          input.value = "";
          saveData();
          renderWeekTasks();
        }
      });
      addWrap.appendChild(input);
      col.appendChild(addWrap);

      weekColsGrid.appendChild(col);
    });

    const pct = totalAll === 0 ? 0 : Math.round((doneAll/totalAll)*100);
    weekProgressBar.style.width = pct + "%";
    weekProgressText.textContent = `${pct}% (${doneAll}/${totalAll})`;
  }

  // ---------- Daily To-Do ----------
  const todayKey = fmtDate(today);
  if(!data.todos[todayKey]) data.todos[todayKey] = [];
  const todoList = document.getElementById("todoList");
  const todoInput = document.getElementById("todoInput");
  const todoStats = document.getElementById("todoStats");

  function renderTodos(){
    const todos = data.todos[todayKey];
    todoList.innerHTML = "";
    if(todos.length === 0){
      const empty = document.createElement("div");
      empty.className = "todo-empty";
      empty.textContent = "오늘의 할 일을 추가해보세요.";
      todoList.appendChild(empty);
    }
    todos.forEach((todo, idx)=>{
      const row = document.createElement("div");
      row.className = "todo-item" + (todo.done ? " done" : "");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = todo.done;
      cb.addEventListener("change", ()=>{
        todo.done = cb.checked;
        saveData();
        renderTodos();
      });

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = todo.text;

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.addEventListener("click", ()=>{
        todos.splice(idx,1);
        saveData();
        renderTodos();
      });

      row.appendChild(cb);
      row.appendChild(label);
      row.appendChild(del);
      todoList.appendChild(row);
    });

    const total = todos.length;
    const doneCount = todos.filter(t=>t.done).length;
    todoStats.textContent = total === 0 ? "" : `완료 ${doneCount} / 전체 ${total}`;
  }

  function addTodo(){
    const val = todoInput.value.trim();
    if(!val) return;
    data.todos[todayKey].push({ text: val, done:false });
    todoInput.value = "";
    saveData();
    renderTodos();
  }
  document.getElementById("addTodoBtn").addEventListener("click", addTodo);
  todoInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addTodo(); });

  // ---------- Init ----------
  renderCalendar();
  renderEventPanel();
  renderWeekRange();
  renderWeekTasks();
  renderTodos();

})();
</script>
</body>
</html>
