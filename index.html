<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스케줄러</title>
  <style>
    :root {
      --bg-color: #fdf6f6;
      --card-bg: #ffffff;
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --text-main: #374151;
      --text-muted: #9ca3af;
      --border-color: #fbcfe8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-area h1 {
      font-size: 1.8rem;
      color: #1f2937;
    }

    .sync-status {
      font-size: 0.85rem;
      color: #6b7280;
      background: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }
    button.secondary { background-color: #8b5cf6; }
    button.secondary:hover { background-color: #7c3aed; }

    .banner-readonly {
      background-color: #fef3c7;
      color: #92400e;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      display: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #f3e8ff;
    }

    .card h2 {
      font-size: 1.1rem;
      color: #db2777;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    input[type="text"] { flex: 1; min-width: 150px; }
    input[type="date"] { width: 140px; }

    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #f3f4f6;
      gap: 8px;
    }

    li:last-child { border-bottom: none; }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .delete-btn {
      background: #ef4444;
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .delete-btn:hover { background: #dc2626; }

    /* Readonly Mode Styling */
    body.readonly-mode .edit-only {
      display: none !important;
    }
    body.readonly-mode .banner-readonly {
      display: block;
    }
  </style>
</head>
<body>

  <div id="readonlyBanner" class="banner-readonly">
    🔒 현재 **보고용 모드(읽기 전용)**로 접속하셨습니다. 수정 및 추가는 불가능합니다.
  </div>

  <div class="header">
    <div class="title-area">
      <h1>📋 스케줄러</h1>
      <div class="sync-status" id="syncStatus">🔄 동기화 확인 중...</div>
    </div>
    <div class="btn-group edit-only">
      <button onclick="copyLink('edit')">✏️ 편집용 링크 복사</button>
      <button class="secondary" onclick="copyLink('view')">🔒 보고용 링크 복사</button>
    </div>
  </div>

  <!-- MEMO -->
  <div class="card">
    <h2>📌 MEMO</h2>
    <div class="input-row edit-only">
      <input type="text" id="memoInput" placeholder="메모를 입력하고 Enter">
      <button onclick="addMemo()">추가</button>
    </div>
    <ul id="memoList"></ul>
  </div>

  <!-- DAILY -->
  <div class="card">
    <h2>일일 업무 (Today's To-Do)</h2>
    <div class="input-row edit-only">
      <input type="text" id="dailyInput" placeholder="할 일을 입력하세요">
      <input type="text" id="dailyUrl" placeholder="링크 URL (선택)">
      <input type="date" id="dailyStart">
      <span>~</span>
      <input type="date" id="dailyEnd">
      <button onclick="addDaily()">추가</button>
    </div>
    <ul id="dailyList"></ul>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjLXPILrFl3pbgXQldCbDPTRufIeEXUhpewlt3unU_P9uZ16dj6FL-Q4Zbet9cWLPh1Q/exec";
    const GLOBAL_KEY = "global_shared_scheduler_data"; // 모든 기기가 공유할 공통 키

    let state = {
      memos: [],
      dailyTasks: [],
      lastSynced: null
    };

    const isViewMode = new URLSearchParams(window.location.search).get('mode') === 'view';

    window.addEventListener('DOMContentLoaded', () => {
      if (isViewMode) {
        document.body.classList.add('readonly-mode');
      }
      loadData();
    });

    function updateSyncUI(timeStr, isError = false) {
      const statusEl = document.getElementById('syncStatus');
      if (isError) {
        statusEl.innerText = "❌ 동기화 실패";
        statusEl.style.color = "#ef4444";
      } else {
        statusEl.innerText = `🟢 마지막 동기화: ${timeStr}`;
        statusEl.style.color = "#059669";
      }
    }

    async function loadData() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const rows = await res.json();
        
        // 공통 키 항목 찾기
        const target = rows.find(r => r.key === GLOBAL_KEY);
        if (target && target.json) {
          const parsed = typeof target.json === 'string' ? JSON.parse(target.json) : target.json;
          state.memos = parsed.memos || [];
          state.dailyTasks = parsed.dailyTasks || [];
        }
        
        const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        updateSyncUI(nowStr);
        render();
      } catch (e) {
        console.error(e);
        updateSyncUI(null, true);
      }
    }

    async function saveData() {
      if (isViewMode) return;
      
      const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('syncStatus').innerText = "🔄 동기화 중...";

      const payload = [{
        key: GLOBAL_KEY,
        json: JSON.stringify({
          memos: state.memos,
          dailyTasks: state.dailyTasks
        })
      }];

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        updateSyncUI(nowStr);
      } catch (e) {
        console.error(e);
        updateSyncUI(null, true);
      }
    }

    function render() {
      // Memo Render
      const memoUl = document.getElementById('memoList');
      memoUl.innerHTML = state.memos.map((m, idx) => `
        <li>
          <span>${escapeHtml(m)}</span>
          ${!isViewMode ? `<button class="delete-btn" onclick="deleteMemo(${idx})">삭제</button>` : ''}
        </li>
      `).join('');

      // Daily Render
      const dailyUl = document.getElementById('dailyList');
      dailyUl.innerHTML = state.dailyTasks.map((d, idx) => `
        <li>
          <div class="item-left">
            <span>${escapeHtml(d.title)}</span>
            ${d.url ? `<a href="${escapeHtml(d.url)}" target="_blank" style="color: #3b82f6; text-decoration: underline; font-size: 0.85rem;">[링크]</a>` : ''}
            <small style="color:#9ca3af;">(${d.start || ''} ~ ${d.end || ''})</small>
          </div>
          ${!isViewMode ? `<button class="delete-btn" onclick="deleteDaily(${idx})">삭제</button>` : ''}
        </li>
      `).join('');
    }

    function addMemo() {
      const input = document.getElementById('memoInput');
      if (!input.value.trim()) return;
      state.memos.push(input.value.trim());
      input.value = '';
      render();
      saveData();
    }

    function deleteMemo(idx) {
      state.memos.splice(idx, 1);
      render();
      saveData();
    }

    function addDaily() {
      const title = document.getElementById('dailyInput').value.trim();
      const url = document.getElementById('dailyUrl').value.trim();
      const start = document.getElementById('dailyStart').value;
      const end = document.getElementById('dailyEnd').value;

      if (!title) return;

      state.dailyTasks.push({ title, url, start, end });
      document.getElementById('dailyInput').value = '';
      document.getElementById('dailyUrl').value = '';
      render();
      saveData();
    }

    function deleteDaily(idx) {
      state.dailyTasks.splice(idx, 1);
      render();
      saveData();
    }

    function copyLink(type) {
      const baseUrl = window.location.origin + window.location.pathname;
      const url = type === 'view' ? `${baseUrl}?mode=view` : baseUrl;
      
      navigator.clipboard.writeText(url).then(() => {
        alert(type === 'view' ? "🔒 보고용(읽기 전용) 링크가 복사되었습니다!" : "✏️ 편집용 링크가 복사되었습니다!");
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
