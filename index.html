<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스케줄러</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2265%25%22 font-size=%2270%22 text-anchor=%22middle%22>💖</text></svg>">
<style>
  :root {
    --bg: #fdf6f8;
    --card: #ffffff;
    --border: #f5dbe4;
    --text: #2b2430;
    --text-soft: #8a7480;
    --accent: #f472b6;
    --accent-dark: #db2777;
    --accent-soft: #fdf2f8;
    --accent-2: #fb7185;
    --danger: #ef4444;
    --shadow: 0 4px 16px rgba(219,119,150,0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 28px 40px 8px; }
  .header-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .sync-badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--border); color: var(--text-soft);
  }
  .btn-group { display: flex; gap: 8px; }
  .action-btn {
    border: none; background: var(--accent); color: #fff; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .action-btn.secondary { background: #8b5cf6; }
  .action-btn.report { background: #0f766e; }
  .action-btn:hover { opacity: 0.9; }

  .banner-readonly {
    background: #fef3c7; color: #92400e; padding: 10px 20px; font-size: 13px;
    font-weight: 600; display: none; text-align: center;
  }
  body.readonly-mode .banner-readonly { display: block; }
  body.readonly-mode .edit-only { display: none !important; }

  .dashboard-stack { display: flex; flex-direction: column; gap: 20px; padding: 20px 40px 40px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px;
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .card-header h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card-header h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  
  .today-date-badge {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent-dark);
    background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; margin-bottom: 12px;
  }

  .day-nav { display: flex; align-items: center; gap: 6px; }
  .day-nav .nav-btn {
    border: none; background: var(--accent-soft); color: var(--accent-dark);
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-weight: 700;
  }
  .day-nav .nav-today-btn {
    border: none; background: var(--accent-soft); color: var(--accent-dark);
    padding: 0 10px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700;
  }
  .day-nav input[type=date] {
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; font-size: 11.5px; outline: none; height: 26px;
  }

  .add-row.simple { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .add-row.simple input[type=text] {
    flex: 1; min-width: 140px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none;
  }
  .add-row.simple select.cat-select {
    width: 112px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12.5px; outline: none;
  }
  .add-row.simple input.link-input {
    flex: 1; min-width: 140px; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 12.5px; outline: none;
  }
  .date-range-row { display: flex; align-items: center; gap: 6px; }
  .date-range-row .date-input { padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 11.5px; outline: none; }
  .add-row.simple button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: 600; font-size: 13px; cursor: pointer;
  }

  /* Tags */
  .cat-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .period-tag { font-size: 10px; font-weight: 600; background: #e0f2fe; color: #0284c7; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }

  /* Memo Cards */
  .memo-card {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    background: #fdf7f9; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .memo-card .txt { flex: 1; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .memo-card button.del {
    border: none; background: transparent; color: var(--accent-dark); cursor: pointer; padding: 2px;
    border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
  }
  .memo-card button.del:hover { background: var(--accent-soft); }

  /* Todo Items */
  .todo-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: #fdf7f9; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; flex-wrap: wrap;
    cursor: grab; user-select: none; transition: transform 0.1s, box-shadow 0.1s;
  }
  .todo-item:active { cursor: grabbing; opacity: 0.7; }
  .todo-item:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .todo-item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .todo-item .label { flex: 1; font-size: 13.5px; word-break: break-word; }
  .todo-item.done .label { text-decoration: line-through; color: var(--text-soft); }
  
  /* Modern Pink Action Buttons */
  .item-actions { display: flex; gap: 4px; align-items: center; }
  .item-actions button {
    border: none; background: transparent; cursor: pointer; color: var(--accent-dark);
    padding: 3px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .item-actions button:hover { background: var(--accent-soft); color: var(--accent-2); }
  .item-actions button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Weekly Grid & Drag Drop Visuals */
  .week-range { font-size: 12px; color: var(--text-soft); font-weight: 600; margin-bottom: 12px; display: block; }
  .week-cols-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .week-col {
    background: #fdf7f9; border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-height: 220px;
    display: flex; flex-direction: column; transition: border-color 0.2s, background 0.2s;
  }
  .week-col.today-col { border-color: var(--accent); background: var(--accent-soft); }
  .week-col.drag-over { border: 2px dashed var(--accent-dark) !important; background: #fbcfe8 !important; }
  
  .week-col-header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 700; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px dashed var(--border);
  }
  .week-col-header .add-day-btn {
    border: none; background: var(--accent); color: #fff; width: 22px; height: 22px;
    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .week-col-header .add-day-btn:hover { background: var(--accent-dark); }

  .week-task-item {
    background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px;
    font-size: 12px; display: flex; flex-direction: column; gap: 4px; cursor: grab; user-select: none; transition: transform 0.1s, box-shadow 0.1s;
  }
  .week-task-item:active { cursor: grabbing; opacity: 0.7; }
  .week-task-item:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
  .week-task-item.done .task-txt { text-decoration: line-through; color: var(--text-soft); }
  .week-task-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .week-task-mid { display: flex; align-items: center; gap: 6px; }
  .week-task-item .task-txt { flex: 1; font-weight: 500; font-size: 12.5px; word-break: break-word; }

  .progress-wrap { margin-top: 16px; }
  .progress-bar { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-soft); margin-top: 6px; font-weight: 600; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav button { border: none; background: var(--accent-soft); color: var(--accent-dark); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-weight: 700; }
  .cal-title { font-weight: 700; font-size: 15px; min-width: 90px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px; }
  .cal-grid .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-soft); padding-bottom: 6px; }
  .cal-day {
    min-height: 95px; border-radius: 10px; padding: 6px; background: #fdf7f9; position: relative; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.today { background: #fce7f3; border: 1.5px solid var(--accent); }
  .cal-day.drag-over { border: 2px dashed var(--accent-dark) !important; background: #fbcfe8 !important; }
  .cal-day .num { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .day-badge {
    font-size: 10px; font-weight: 600; padding: 3px 5px; border-radius: 4px;
    margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 4px;
    cursor: grab; transition: transform 0.1s, opacity 0.2s; user-select: none;
  }
  .day-badge.done { text-decoration: line-through; opacity: 0.6; }
  .day-badge:active { cursor: grabbing; opacity: 0.7; }
  .day-badge:hover { transform: scale(1.02); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(43,36,48,0.45); display: none; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 380px; }
  .modal-box h3 { margin-bottom: 14px; font-size: 15px; }
  .modal-box input, .modal-box select { width: 100%; margin-top: 8px; padding: 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal-actions button { border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .modal-actions .cancel-btn { background: var(--bg); color: var(--text-soft); }
  .modal-actions .confirm-btn { background: var(--accent); color: #fff; }

  .hint-tag { font-size: 11px; color: var(--text-soft); font-weight: 500; }

  @media (max-width: 900px) {
    .week-cols-grid { grid-template-columns: repeat(2, 1fr); }
    .dashboard-stack { padding: 16px; }
    header { padding: 20px 16px 4px; }
  }
  @media (max-width: 500px) {
    .week-cols-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="banner-readonly">
  🔒 현재 **보고용 모드(읽기 전용)**로 접속하셨습니다. 수정 및 추가는 불가능합니다.
</div>

<header>
  <div class="header-top">
    <div style="display:flex; align-items:center; gap:12px;">
      <h1>📋 스케줄러</h1>
      <span class="sync-badge" id="syncStatus">🔄 데이터 로딩 중...</span>
    </div>
    <div class="btn-group">
      <button class="action-btn edit-only" onclick="copyLink('edit')">✏️ 편집용 링크 복사</button>
      <button class="action-btn secondary edit-only" onclick="copyLink('view')">🔒 보고용 링크 복사</button>
      <button class="action-btn report" onclick="goWeeklyReport()">📊 마케터 주간보고</button>
    </div>
  </div>
</header>

<div class="dashboard-stack">

  <!-- 0. MEMO -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>MEMO</h2>
    </div>
    <div class="add-row simple edit-only">
      <input type="text" id="memoInput" placeholder="메모를 입력하고 Enter">
      <button id="addMemoBtn">추가</button>
    </div>
    <div id="memoList"></div>
  </div>

  <!-- 1. Today's To-Do -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>일일 업무 (Today's To-Do)</h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="hint-tag edit-only">💡 <b>드래그</b>: 이동 | <b>Ctrl+드래그</b>: 복제 | <b>클릭</b>: 수정</span>
        <div class="day-nav">
          <button id="todoPrevDay" class="nav-btn">‹</button>
          <button id="todoTodayBtn" class="nav-today-btn">오늘</button>
          <button id="todoNextDay" class="nav-btn">›</button>
          <input type="date" id="todoDatePicker">
        </div>
      </div>
    </div>
    <span class="today-date-badge" id="todoDateBadge"></span>
    <div class="add-row simple edit-only">
      <select class="cat-select" id="todoCategorySelect"></select>
      <input type="text" id="todoInput" placeholder="할 일을 입력하세요 (Enter 저장)">
      <input type="url" class="link-input" id="todoLinkInput" placeholder="링크 URL (선택)">
      <div class="date-range-row">
        <input type="date" class="date-input" id="todoStartDate">
        <span>~</span>
        <input type="date" class="date-input" id="todoEndDate">
      </div>
      <button id="addTodoBtn">추가</button>
    </div>
    <div id="todoList"></div>
  </div>

  <!-- 2. Weekly Tasks -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>주간 업무 (Weekly Tasks)</h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="hint-tag edit-only">💡 <b>드래그</b>: 이동 | <b>Ctrl+드래그</b>: 복제 | <b>클릭</b>: 수정</span>
        <div class="day-nav">
          <button id="weekPrevBtn" class="nav-btn">‹</button>
          <button id="weekTodayBtn" class="nav-today-btn">이번주</button>
          <button id="weekNextBtn" class="nav-btn">›</button>
        </div>
      </div>
    </div>
    <span class="week-range" id="weekRange"></span>
    <div class="week-cols-grid" id="weekColsGrid"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="weekProgressBar" style="width:0%"></div></div>
      <div class="progress-label">
        <span>이번 주 전체 진행률</span>
        <span id="weekProgressText">0%</span>
      </div>
    </div>
  </div>

  <!-- 3. Monthly Calendar -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>월간 달력</h2>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="hint-tag edit-only">💡 <b>드래그</b>: 이동 | <b>Ctrl+드래그</b>: 복제 | <b>클릭</b>: 수정</span>
        <div class="cal-nav">
          <button id="prevMonth">‹</button>
          <span class="cal-title" id="calTitle"></span>
          <button id="nextMonth">›</button>
        </div>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

</div>

<!-- Modal (추가 / 수정 공용) -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-box">
    <h3 id="modalTitle">일정 추가</h3>
    <input type="hidden" id="modalTaskId">
    <input type="text" id="modalTaskInput" placeholder="일정을 입력하세요 (Enter 저장)">
    <select class="cat-select" id="modalCategorySelect"></select>
    <input type="url" id="modalLinkInput" placeholder="링크 URL (선택)">
    <div class="date-range-row" style="margin-top:10px;">
      <input type="date" class="date-input" id="modalStartDate">
      <span>~</span>
      <input type="date" class="date-input" id="modalEndDate">
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" id="modalCancelBtn">취소</button>
      <button class="confirm-btn" id="modalSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
(async function() {
  "use strict";

  const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyjLXPILrFl3pbgXQldCbDPTRufIeEXUhpewlt3unU_P9uZ16dj6FL-Q4Zbet9cWLPh1Q/exec";
  const PRIMARY_KEY = "global_shared_scheduler_data";
  
  const CATEGORIES = ["PPL","택배","SNS","디자인","서류","품의","지결","인플루언서","크리에이터","체험단","이벤트","촬영","컨펌","미팅","엠버서더","무엠버서더","기타"];
  
  const CATEGORY_COLORS = {
    "PPL": { bg:"#fef08a", fg:"#854d0e" },
    "택배": { bg:"#fed7aa", fg:"#9a3412" },
    "SNS": { bg:"#e0f2fe", fg:"#0284c7" },
    "디자인": { bg:"#f3e8ff", fg:"#9333ea" },
    "서류": { bg:"#f1f5f9", fg:"#475569" },
    "품의": { bg:"#fef3c7", fg:"#b45309" },
    "지결": { bg:"#ccfbf1", fg:"#0f766e" },
    "인플루언서": { bg:"#ffe4e6", fg:"#e11d48" },
    "크리에이터": { bg:"#e0e7ff", fg:"#4338ca" },
    "체험단": { bg:"#ecfccb", fg:"#4d7c0f" },
    "이벤트": { bg:"#ffedd5", fg:"#c2410c" },
    "촬영": { bg:"#e9d5ff", fg:"#6b21a8" },
    "컨펌": { bg:"#d1fae5", fg:"#065f46" },
    "미팅": { bg:"#fce7f3", fg:"#9d174d" },
    "엠버서더": { bg:"#dbeafe", fg:"#1e40af" },
    "무엠버서더": { bg:"#e0e7ff", fg:"#3730a3" },
    "기타": { bg:"#f3f4f6", fg:"#374151" }
  };

  const ICON_EDIT = `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
  const ICON_DEL = `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

  const isViewMode = new URLSearchParams(window.location.search).get('mode') === 'view';
  if (isViewMode) document.body.classList.add('readonly-mode');

  let state = {
    taskList: [], 
    memoCards: [],
    customCategories: []
  };

  let selectedTodoDate = new Date();
  let selectedWeekDate = new Date();
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let draggedTaskId = null;

  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function genId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function updateSyncUI(msg, isError = false) {
    const el = document.getElementById("syncStatus");
    el.textContent = isError ? "❌ " + msg : "🟢 " + msg;
    el.style.color = isError ? "#ef4444" : "#059669";
  }

  let dataLoaded = false;

  async function loadData() {
    try {
      const res = await fetch(SHEET_API_URL);
      const rows = await res.json();
      
      let loadedData = null;
      if (Array.isArray(rows) && rows.length > 0) {
        let target = rows.find(r => r.key === PRIMARY_KEY || r.key === "my_main_scheduler_data" || r.key === "global_dashboard_data");
        if (!target) target = rows.find(r => {
          try {
            const o = typeof r.json === 'string' ? JSON.parse(r.json) : r.json;
            return o && (o.taskList || o.dailyTasks || o.memoCards);
          } catch (e) { return false; }
        });
        if (target && target.json) {
          loadedData = typeof target.json === 'string' ? JSON.parse(target.json) : target.json;
        }
      }

      if (loadedData) {
        state.memoCards = loadedData.memoCards || loadedData.memos || [];
        state.customCategories = loadedData.customCategories || [];

        if (loadedData.taskList) {
          state.taskList = loadedData.taskList;
        } else if (loadedData.dailyTasks) {
          state.taskList = loadedData.dailyTasks.map(t => ({
            id: genId(),
            text: t.title || t.text,
            done: !!t.done,
            category: t.category || CATEGORIES[0],
            startDate: t.start || fmtDate(new Date()),
            endDate: t.end || t.start || fmtDate(new Date()),
            link: t.url || t.link || ""
          }));
        }
      }

      if (loadedData) {
        dataLoaded = true;
        try { localStorage.setItem('sched_backup', JSON.stringify({ data: loadedData, at: Date.now() })); } catch (e) {}
      } else {
        let backup = null;
        try { backup = JSON.parse(localStorage.getItem('sched_backup') || 'null'); } catch (e) {}
        if (backup && backup.data && (backup.data.taskList || []).length) {
          state.taskList = backup.data.taskList || [];
          state.memoCards = backup.data.memoCards || [];
          state.customCategories = backup.data.customCategories || [];
          dataLoaded = true;
          updateSyncUI("서버가 비어 있어 이 기기의 백업을 불러왔어요", true);
          renderAll();
          alert("서버에 저장된 일정이 없어서, 이 기기에 남아있던 백업을 불러왔습니다.\n내용이 맞으면 아무 업무나 하나 수정해 저장하시면 서버에 다시 올라갑니다.");
          return;
        }
        dataLoaded = true;
      }

      const nowTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      updateSyncUI(`동기화 완료 (${nowTime})`);
      renderAll();
    } catch (e) {
      console.error(e);
      dataLoaded = false;
      updateSyncUI("불러오기 실패 · 저장 잠금", true);
    }
  }

  async function saveData() {
    if (isViewMode) return;
    if (!dataLoaded) {
      updateSyncUI("불러오기 실패 상태 · 저장을 막았어요", true);
      return;
    }
    updateSyncUI("저장 중...");

    const mine = {
      key: PRIMARY_KEY,
      json: JSON.stringify({
        taskList: state.taskList,
        memoCards: state.memoCards,
        customCategories: state.customCategories
      })
    };
    try { localStorage.setItem('sched_backup', JSON.stringify({ data: JSON.parse(mine.json), at: Date.now() })); } catch (e) {}

    // 다른 페이지(주간보고 등)가 저장해 둔 행이 지워지지 않도록 전부 함께 다시 보냅니다.
    let payload = [mine];
    try {
      const res = await fetch(SHEET_API_URL);
      const rows = await res.json();
      if (Array.isArray(rows)) {
        const others = rows
          .filter(r => r && r.key && r.key !== PRIMARY_KEY)
          .map(r => ({ key: r.key, json: typeof r.json === 'string' ? r.json : JSON.stringify(r.json) }));
        payload = [mine].concat(others);
      }
    } catch (e) {
      console.error(e);
      updateSyncUI("서버 확인 실패 · 저장을 멈췄어요", true);
      return;
    }

    try {
      await fetch(SHEET_API_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const nowTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      updateSyncUI(`동기화 완료 (${nowTime})`);
    } catch (e) {
      console.error(e);
      updateSyncUI("저장 실패", true);
    }
  }

  function renderAll() {
    renderCategorySelects();
    renderMemos();
    renderTodos();
    renderWeekly();
    renderCalendar();
  }

  function getCategoryColor(cat) {
    if (!cat) return CATEGORY_COLORS["기타"];
    const cleanCat = String(cat).trim();
    
    if (CATEGORY_COLORS[cleanCat]) return CATEGORY_COLORS[cleanCat];
    
    const matchKey = Object.keys(CATEGORY_COLORS).find(k => k.toLowerCase() === cleanCat.toLowerCase());
    if (matchKey) return CATEGORY_COLORS[matchKey];

    let hash = 0;
    for (let i = 0; i < cleanCat.length; i++) {
      hash = cleanCat.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = Math.abs(hash) % 360;
    return {
      bg: `hsl(${hue}, 85%, 90%)`,
      fg: `hsl(${hue}, 70%, 28%)`
    };
  }

  function renderCategorySelects() {
    const allCats = [...new Set(CATEGORIES.concat(state.customCategories))];
    const selects = [document.getElementById("todoCategorySelect"), document.getElementById("modalCategorySelect")];
    selects.forEach(select => {
      if (!select) return;
      select.innerHTML = allCats.map(c => `<option value="${c}">${c}</option>`).join('');
    });
  }

  /* Memos */
  function renderMemos() {
    const container = document.getElementById("memoList");
    if (state.memoCards.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:var(--text-soft); font-size:13px; padding:12px;">등록된 메모가 없습니다.</div>`;
      return;
    }
    container.innerHTML = state.memoCards.map((m, idx) => `
      <div class="memo-card">
        <div class="txt">${escapeHtml(m)}</div>
        ${!isViewMode ? `<button class="del" onclick="deleteMemo(${idx})" title="삭제">${ICON_DEL}</button>` : ''}
      </div>
    `).join('');
  }

  window.deleteMemo = function(idx) {
    state.memoCards.splice(idx, 1);
    renderMemos();
    saveData();
  };

  function getPeriodLabel(start, end) {
    if (!start || !end || start === end) return "";
    const sStr = start.slice(5).replace('-', '/');
    const eStr = end.slice(5).replace('-', '/');
    return `<span class="period-tag">🗓️ ${sStr}~${eStr}</span>`;
  }

  window.handleTaskClick = function(e, id) {
    if (isViewMode) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'A' || e.target.closest('button')) return;

    e.stopPropagation();

    if (e.ctrlKey || e.metaKey) {
      const orig = state.taskList.find(t => t.id === id);
      if (orig) {
        const newTask = Object.assign({}, orig, {
          id: genId(),
          text: orig.text + " (복사본)"
        });
        state.taskList.push(newTask);
        renderAll();
        saveData();
      }
    } else {
      openEditModal(id);
    }
  };

  /* Drag and Drop */
  window.handleDragStart = function(e, id) {
    if (isViewMode) return;
    draggedTaskId = id;
    e.dataTransfer.setData('text/plain', id);
    e.dataTransfer.effectAllowed = 'copyMove';
  };

  window.handleDragOver = function(e) {
    if (isViewMode) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = (e.ctrlKey || e.metaKey) ? 'copy' : 'move';
    e.currentTarget.classList.add('drag-over');
  };

  window.handleDragLeave = function(e) {
    e.currentTarget.classList.remove('drag-over');
  };

  window.handleDrop = function(e, targetDateStr) {
    if (isViewMode) return;
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');

    const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
    if (!id) return;

    const task = state.taskList.find(t => t.id === id);
    if (!task) return;

    const isCopy = e.ctrlKey || e.metaKey;

    let s = new Date(task.startDate);
    let eDate = new Date(task.endDate);
    let diffDays = Math.round((eDate - s) / (1000 * 60 * 60 * 24));
    if (isNaN(diffDays) || diffDays < 0) diffDays = 0;

    let targetStart = new Date(targetDateStr);
    let targetEnd = new Date(targetDateStr);
    targetEnd.setDate(targetStart.getDate() + diffDays);

    const newStartStr = targetDateStr;
    const newEndStr = fmtDate(targetEnd);

    if (isCopy) {
      const newTask = Object.assign({}, task, {
        id: genId(),
        text: task.text + " (복사본)",
        startDate: newStartStr,
        endDate: newEndStr
      });
      state.taskList.push(newTask);
    } else {
      task.startDate = newStartStr;
      task.endDate = newEndStr;
    }

    draggedTaskId = null;
    renderAll();
    saveData();
  };

  /* Todos - 미완료 우선 정렬 추가 */
  function renderTodos() {
    const dateStr = fmtDate(selectedTodoDate);
    document.getElementById("todoDateBadge").textContent = `${dateStr} (${["일","월","화","수","목","금","토"][selectedTodoDate.getDay()]})`;
    document.getElementById("todoDatePicker").value = dateStr;

    const dayTasks = state.taskList
      .filter(t => t.startDate <= dateStr && dateStr <= t.endDate)
      .sort((a, b) => Number(a.done) - Number(b.done)); // 미완료(false=0) 상단, 완료(true=1) 하단

    const container = document.getElementById("todoList");

    if (dayTasks.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:var(--text-soft); font-size:13px; padding:18px;">할 일이 없습니다.</div>`;
      return;
    }

    container.innerHTML = dayTasks.map(t => {
      const c = getCategoryColor(t.category);
      const periodLabel = getPeriodLabel(t.startDate, t.endDate);
      return `
        <div class="todo-item ${t.done ? 'done' : ''}"
             draggable="${!isViewMode}"
             ondragstart="handleDragStart(event, '${t.id}')"
             onclick="handleTaskClick(event, '${t.id}')">
          <input type="checkbox" ${t.done ? 'checked' : ''} ${isViewMode ? 'disabled' : ''} onclick="event.stopPropagation(); toggleTaskDone('${t.id}')">
          <span class="cat-tag" style="background:${c.bg}; color:${c.fg};">${t.category || '기타'}</span>
          ${periodLabel}
          <span class="label">${escapeHtml(t.text)}</span>
          ${t.link ? `<a href="${escapeHtml(t.link)}" target="_blank" onclick="event.stopPropagation();" style="text-decoration:none;">🔗</a>` : ''}
          ${!isViewMode ? `
            <div class="item-actions">
              <button onclick="event.stopPropagation(); openEditModal('${t.id}')" title="수정">${ICON_EDIT}</button>
              <button onclick="event.stopPropagation(); deleteTask('${t.id}')" title="삭제">${ICON_DEL}</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  window.toggleTaskDone = function(id) {
    const task = state.taskList.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      renderAll();
      saveData();
    }
  };

  window.deleteTask = function(id) {
    state.taskList = state.taskList.filter(t => t.id !== id);
    renderAll();
    saveData();
  };

  /* Weekly Tasks - 미완료 우선 정렬 추가 */
  function renderWeekly() {
    const startOfWeek = new Date(selectedWeekDate);
    const day = startOfWeek.getDay();
    const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
    startOfWeek.setDate(diff);

    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 4);

    document.getElementById("weekRange").textContent = `${fmtDate(startOfWeek)} ~ ${fmtDate(endOfWeek)}`;

    const grid = document.getElementById("weekColsGrid");
    grid.innerHTML = "";

    let totalTasks = 0;
    let completedTasks = 0;

    const days = ["월", "화", "수", "목", "금"];
    for (let i = 0; i < 5; i++) {
      const d = new Date(startOfWeek);
      d.setDate(startOfWeek.getDate() + i);
      const dStr = fmtDate(d);
      const isToday = dStr === fmtDate(new Date());

      const tasks = state.taskList
        .filter(t => t.startDate <= dStr && dStr <= t.endDate)
        .sort((a, b) => Number(a.done) - Number(b.done)); // 미완료 우선 정렬

      totalTasks += tasks.length;
      completedTasks += tasks.filter(t => t.done).length;

      const col = document.createElement("div");
      col.className = `week-col ${isToday ? 'today-col' : ''}`;
      col.ondragover = (e) => handleDragOver(e);
      col.ondragleave = (e) => handleDragLeave(e);
      col.ondrop = (e) => handleDrop(e, dStr);

      col.innerHTML = `
        <div class="week-col-header">
          <span>${days[i]} <small style="font-size:11px; font-weight:400; color:var(--text-soft);">${d.getMonth()+1}/${d.getDate()}</small></span>
          ${!isViewMode ? `<button class="add-day-btn" onclick="openAddModalForDate('${dStr}')" title="이 날짜에 업무 추가">+</button>` : ''}
        </div>
        <div class="week-tasks">
          ${tasks.map(t => {
            const c = getCategoryColor(t.category);
            const periodLabel = getPeriodLabel(t.startDate, t.endDate);
            return `
              <div class="week-task-item ${t.done ? 'done' : ''}"
                   draggable="${!isViewMode}"
                   ondragstart="handleDragStart(event, '${t.id}')"
                   onclick="handleTaskClick(event, '${t.id}')">
                <div class="week-task-top">
                  <span class="cat-tag" style="background:${c.bg}; color:${c.fg};">${t.category || '기타'}</span>
                  ${!isViewMode ? `
                    <div class="item-actions">
                      <button onclick="event.stopPropagation(); openEditModal('${t.id}')" title="수정">${ICON_EDIT}</button>
                      <button onclick="event.stopPropagation(); deleteTask('${t.id}')" title="삭제">${ICON_DEL}</button>
                    </div>
                  ` : ''}
                </div>
                <div class="week-task-mid">
                  <input type="checkbox" ${t.done ? 'checked' : ''} ${isViewMode ? 'disabled' : ''} onclick="event.stopPropagation(); toggleTaskDone('${t.id}')">
                  <span class="task-txt">${escapeHtml(t.text)}</span>
                  ${t.link ? `<a href="${escapeHtml(t.link)}" target="_blank" onclick="event.stopPropagation();" style="text-decoration:none;">🔗</a>` : ''}
                </div>
                ${periodLabel ? `<div style="margin-top:2px;">${periodLabel}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
      grid.appendChild(col);
    }

    const rate = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
    document.getElementById("weekProgressBar").style.width = rate + "%";
    document.getElementById("weekProgressText").textContent = rate + "%";
  }

  /* Calendar - 미완료 우선 정렬 추가 */
  function renderCalendar() {
    document.getElementById("calTitle").textContent = `${calYear}년 ${calMonth + 1}월`;
    const grid = document.getElementById("calGrid");
    grid.innerHTML = ["일","월","화","수","목","금","토"].map(d => `<div class="dow">${d}</div>`).join('');

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const lastDate = new Date(calYear, calMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.appendChild(Object.assign(document.createElement("div"), { className: "cal-day empty" }));
    }

    const todayStr = fmtDate(new Date());

    for (let day = 1; day <= lastDate; day++) {
      const dateObj = new Date(calYear, calMonth, day);
      const dateStr = fmtDate(dateObj);
      const isToday = dateStr === todayStr;

      const dayCell = document.createElement("div");
      dayCell.className = `cal-day ${isToday ? 'today' : ''}`;
      dayCell.ondragover = (e) => handleDragOver(e);
      dayCell.ondragleave = (e) => handleDragLeave(e);
      dayCell.ondrop = (e) => handleDrop(e, dateStr);

      dayCell.innerHTML = `<div class="num">${day}</div>`;

      const tasks = state.taskList
        .filter(t => t.startDate <= dateStr && dateStr <= t.endDate)
        .sort((a, b) => Number(a.done) - Number(b.done)); // 미완료 우선 정렬

      tasks.forEach(t => {
        const c = getCategoryColor(t.category);
        const badge = document.createElement("div");
        badge.className = `day-badge ${t.done ? 'done' : ''}`;
        badge.style.background = c.bg;
        badge.style.color = c.fg;
        badge.setAttribute("draggable", !isViewMode);
        badge.ondragstart = (e) => handleDragStart(e, t.id);
        badge.innerHTML = `<span style="font-size:9px; font-weight:800; opacity:0.85;">[${t.category || '기타'}]</span> <span>${escapeHtml(t.text)}</span>`;
        
        badge.onclick = (e) => handleTaskClick(e, t.id);

        dayCell.appendChild(badge);
      });

      if (!isViewMode) {
        dayCell.onclick = (e) => {
          if (e.target === dayCell || e.target.classList.contains("num")) {
            openAddModalForDate(dateStr);
          }
        };
      }

      grid.appendChild(dayCell);
    }
  }

  // --- Modal Control (Add / Edit) ---

    document.getElementById("modalTitle").textContent = "일정 추가";
    document.getElementById("modalTaskId").value = "";
    document.getElementById("modalTaskInput").value = "";
    document.getElementById("modalLinkInput").value = "";
    document.getElementById("modalStartDate").value = dateStr;
    document.getElementById("modalEndDate").value = dateStr;
    document.getElementById("taskModal").classList.add("open");
    setTimeout(() => document.getElementById("modalTaskInput").focus(), 50);
  };

  window.openEditModal = function(id) {
    const task = state.taskList.find(t => t.id === id);
    if (!task) return;

    document.getElementById("modalTitle").textContent = "일정 수정";
    document.getElementById("modalTaskId").value = task.id;
    document.getElementById("modalTaskInput").value = task.text;
    document.getElementById("modalCategorySelect").value = task.category || CATEGORIES[0];
    document.getElementById("modalLinkInput").value = task.link || "";
    document.getElementById("modalStartDate").value = task.startDate;
    document.getElementById("modalEndDate").value = task.endDate;
    document.getElementById("taskModal").classList.add("open");
    setTimeout(() => document.getElementById("modalTaskInput").focus(), 50);
  };

  document.getElementById("modalCancelBtn").onclick = () => {
    document.getElementById("taskModal").classList.remove("open");
  };

  document.getElementById("modalSaveBtn").onclick = () => {
    const text = document.getElementById("modalTaskInput").value.trim();
    if (!text) return;

    const taskId = document.getElementById("modalTaskId").value;
    const start = document.getElementById("modalStartDate").value || fmtDate(new Date());
    const end = document.getElementById("modalEndDate").value || start;

    if (taskId) {
      const task = state.taskList.find(t => t.id === taskId);
      if (task) {
        task.text = text;
        task.category = document.getElementById("modalCategorySelect").value;
        task.link = document.getElementById("modalLinkInput").value.trim();
        task.startDate = start;
        task.endDate = end < start ? start : end;
      }
    } else {
      state.taskList.push({
        id: genId(),
        text: text,
        done: false,
        category: document.getElementById("modalCategorySelect").value,
        startDate: start,
        endDate: end < start ? start : end,
        link: document.getElementById("modalLinkInput").value.trim()
      });
    }

    document.getElementById("taskModal").classList.remove("open");
    renderAll();
    saveData();
  };

    const val = input.value.trim();

    input.value = "";
    renderMemos();

    const dateStr = fmtDate(selectedTodoDate);
    const start = document.getElementById("todoStartDate").value || dateStr;

      id: genId(),

      startDate: start,
      endDate: end < start ? start : end,
      link: document.getElementById("todoLinkInput").value.trim()
    });

    document.getElementById("todoInput").value = "";
    document.getElementById("todoLinkInput").value = "";
    renderAll();
    saveData();

        }
      });
    }

    const el = document.getElementById(id);
    if (el) {

        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("modalSaveBtn").click();
        }
      });
    }

  // Date Navigations
  document.getElementById("todoPrevDay").onclick = () => { selectedTodoDate.setDate(selectedTodoDate.getDate() - 1); renderTodos(); };
  document.getElementById("todoNextDay").onclick = () => { selectedTodoDate.setDate(selectedTodoDate.getDate() + 1); renderTodos(); };
  document.getElementById("todoTodayBtn").onclick = () => { selectedTodoDate = new Date(); renderTodos(); };
  document.getElementById("todoDatePicker").onchange = (e) => { if(e.target.value) { selectedTodoDate = new Date(e.target.value); renderTodos(); } };

  document.getElementById("weekPrevBtn").onclick = () => { selectedWeekDate.setDate(selectedWeekDate.getDate() - 7); renderWeekly(); };
  document.getElementById("weekNextBtn").onclick = () => { selectedWeekDate.setDate(selectedWeekDate.getDate() + 7); renderWeekly(); };
  document.getElementById("weekTodayBtn").onclick = () => { selectedWeekDate = new Date(); renderWeekly(); };

  document.getElementById("prevMonth").onclick = () => { calMonth--; if(calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
  document.getElementById("nextMonth").onclick = () => { calMonth++; if(calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };

  window.goWeeklyReport = function() {
    const base = window.location.pathname.replace(/[^/]*$/, '');
    window.location.href = base + 'report.html' + (isViewMode ? '?mode=view' : '');
  };

  window.copyLink = function(type) {
    const baseUrl = window.location.origin + window.location.pathname;
    const url = type === 'view' ? `${baseUrl}?mode=view` : baseUrl;
    navigator.clipboard.writeText(url).then(() => {
      alert(type === 'view' ? "🔒 보고용(읽기 전용) 링크가 복사되었습니다!" : "✏️ 편집용 링크가 복사되었습니다!");
    });
  };

  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Initial Load
  const todayStr = fmtDate(new Date());
