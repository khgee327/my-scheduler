<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스케줄러</title>
<style>
  :root{
    --bg:#fdf6f8;
    --card:#ffffff;
    --border:#f5dbe4;
    --text:#2b2430;
    --text-soft:#8a7480;
    --accent:#f472b6;
    --accent-dark:#db2777;
    --accent-soft:#fdf2f8;
    --accent-2:#fb7185;
    --danger:#ef4444;
    --danger-soft:#fee2e2;
    --shadow:0 4px 16px rgba(219,119,150,0.08);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:28px 40px 8px;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
  }
  header p{
    margin:6px 0 0;
    color:var(--text-soft);
    font-size:14px;
  }
  .dashboard-stack{
    display:flex;
    flex-direction:column;
    gap:20px;
    padding:20px 40px 40px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
  }
  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .card-header h2{
    font-size:16px;
    font-weight:700;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-header h2 .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .today-date-badge{
    font-size:12px;
    font-weight:700;
    color:var(--accent-dark);
    background:var(--accent-soft);
    padding:5px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* Category tag & select */
  .cat-tag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  select.cat-select{
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    background:#fff;
    color:var(--text);
    outline:none;
    cursor:pointer;
  }
  select.cat-select:focus{ border-color:var(--accent); }

  /* Calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cal-nav button{
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    width:28px;height:28px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
  }
  .cal-nav button:hover{ background:#fbcfe8; }
  .cal-title{
    font-weight:700;
    font-size:15px;
    min-width:90px;
    text-align:center;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
  }
  .cal-grid .dow{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--text-soft);
    padding-bottom:6px;
  }
  .cal-day{
    position:relative;
    min-height:92px;
    border-radius:10px;
    padding:6px 6px;
    background:#fdf7f9;
    border:1px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .cal-day:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .cal-day.empty{
    background:transparent;
  }
  .cal-day.empty:hover{
    border-color:transparent;
    background:transparent;
  }
  .cal-day .num{
    font-size:12px;
    font-weight:600;
    color:var(--text);
  }
  .cal-day.today{
    background:var(--accent);
  }
  .cal-day.today .num{
    color:#fff;
    font-weight:800;
  }
  .day-add-btn{
    position:absolute;
    top:4px;
    right:4px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .cal-day:hover .day-add-btn{ display:flex; }
  .cal-day.today .day-add-btn{ background:#fff; color:var(--accent-dark); }
  .day-badges{
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .day-badge{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2px;
    font-size:9.5px;
    font-weight:700;
    padding:2px 5px;
    border-radius:5px;
    overflow:hidden;
  }
  .day-badge .txt{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .day-badge.done .txt{
    text-decoration:line-through;
    opacity:.6;
  }
  .day-badge-del{
    border:none;
    background:transparent;
    color:inherit;
    cursor:pointer;
    font-size:10px;
    line-height:1;
    padding:0 2px;
    display:none;
    flex-shrink:0;
  }
  .day-badge:hover .day-badge-del{ display:inline; }
  .day-badge-more{
    font-size:9px;
    color:var(--text-soft);
    font-weight:700;
    padding-left:2px;
  }

  /* Add-task modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,36,48,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:22px;
    width:100%;
    max-width:360px;
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
  }
  .modal-box h3{
    margin:0 0 14px;
    font-size:15px;
    font-weight:700;
  }
  .modal-box input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    outline:none;
  }
  .modal-box input[type=text]:focus{ border-color:var(--accent); }
  .modal-box select.cat-select{
    width:100%;
    margin-top:10px;
    padding:10px 12px;
    font-size:14px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:16px;
  }
  .modal-actions button{
    border:none;
    border-radius:8px;
    padding:8px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .modal-actions .cancel-btn{
    background:var(--bg);
    color:var(--text-soft);
  }
  .modal-actions .cancel-btn:hover{ background:#f5e3ea; }
  .modal-actions .confirm-btn{
    background:var(--accent);
    color:#fff;
  }
  .modal-actions .confirm-btn:hover{ background:var(--accent-dark); }

  /* Weekly tasks (Mon-Fri columns) */
  .week-range{
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
  }
  .week-cols-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  .week-col{
    background:#fdf7f9;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    min-height:180px;
  }
  .week-col.today-col{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .week-col-header{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    padding-bottom:8px;
    padding-right:22px;
    border-bottom:1px dashed var(--border);
  }
  .week-col-header .day-label{
    font-size:13px;
    font-weight:700;
  }
  .week-add-btn{
    position:absolute;
    top:50%;
    right:0;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:13px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .week-col-header:hover .week-add-btn{ display:flex; }
  .week-col-tasks{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .week-task-item{
    display:flex;
    align-items:flex-start;
    gap:6px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
  }
  .week-task-item input[type=checkbox]{
    width:15px;height:15px;
    margin-top:2px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
  }
  .week-task-item .label{
    flex:1;
    font-size:12.5px;
    line-height:1.4;
    word-break:break-word;
  }
  .week-task-item.done .label{
    text-decoration:line-through;
    color:var(--text-soft);
  }
  .week-task-item button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:11px;
    padding:0 2px;
    flex-shrink:0;
  }
  .week-task-item button.del:hover{ color:var(--danger); }
  .week-col-empty{
    color:var(--text-soft);
    font-size:11.5px;
    text-align:center;
    padding:10px 0;
  }

  .progress-wrap{
    margin-top:16px;
  }
  .progress-bar{
    height:8px;
    background:var(--accent-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:999px;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-soft);
    margin-top:6px;
    font-weight:600;
  }

  .add-row.simple{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .add-row.simple input[type=text]{
    flex:1;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    outline:none;
  }
  .add-row.simple input[type=text]:focus{ border-color:var(--accent); }
  .add-row.simple select.cat-select{
    width:112px;
    flex-shrink:0;
  }
  .add-row.simple button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .add-row.simple button:hover{ background:var(--accent-dark); }

  /* Todo */
  .todo-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:#fdf7f9;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
  }
  .todo-item input[type=checkbox]{
    width:18px;height:18px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
  }
  .todo-item .label{
    flex:1;
    font-size:14px;
  }
  .todo-item.done{
    background:#f7eef1;
  }
  .todo-item.done .label{
    text-decoration:line-through;
    color:var(--text-soft);
  }
  .todo-item button.edit,
  .todo-item button.del{
    border:none;
    background:transparent;
    color:var(--text-soft);
    cursor:pointer;
    font-size:14px;
    opacity:0;
    transition:opacity .15s;
    flex-shrink:0;
  }
  .todo-item:hover button.edit,
  .todo-item:hover button.del{ opacity:1; }
  .todo-item button.edit:hover{ color:var(--accent-dark); }
  .todo-item button.del:hover{ color:var(--danger); }
  .todo-item.editing{
    background:#fff;
    border-color:var(--accent);
  }
  .todo-item .edit-input{
    flex:1;
    font-size:14px;
    padding:6px 8px;
    border:1px solid var(--accent);
    border-radius:6px;
    outline:none;
  }
  .todo-item select.cat-select{
    width:92px;
    flex-shrink:0;
    padding:6px 8px;
    font-size:12px;
  }
  .todo-item button.save{
    border:none;
    background:var(--accent-2);
    color:#fff;
    border-radius:6px;
    width:26px;height:26px;
    cursor:pointer;
    font-size:13px;
    flex-shrink:0;
    opacity:1;
  }
  .todo-item button.save:hover{ background:var(--accent-dark); }
  .todo-empty{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:24px 0;
  }
  .todo-stats{
    margin-top:12px;
    font-size:12px;
    color:var(--text-soft);
    font-weight:600;
    text-align:right;
  }

  @media (max-width:1100px){
    .week-cols-grid{ grid-template-columns:repeat(3,1fr); }
  }
  @media (max-width:700px){
    .week-cols-grid{ grid-template-columns:repeat(2,1fr); }
    .dashboard-stack{ padding:16px; }
    header{ padding:20px 16px 4px; }
  }
  @media (max-width:480px){
    .week-cols-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 스케줄러</h1>
  <p id="todayLabel"></p>
</header>

<div class="dashboard-stack">

  <!-- 1. 일일 업무 (Today's To-Do) -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>일일 업무 (Today's To-Do)</h2>
      <span class="today-date-badge" id="todoDateBadge"></span>
    </div>
    <div class="add-row simple">
      <select class="cat-select" id="todoCategorySelect"></select>
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter">
      <button id="addTodoBtn">추가</button>
    </div>
    <div id="todoList"></div>
    <div class="todo-stats" id="todoStats"></div>
  </div>

  <!-- 2. 주간 업무 (Weekly Tasks) - 월~금 5칼럼 -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>주간 업무 (Weekly Tasks)</h2>
      <span class="week-range" id="weekRange"></span>
    </div>
    <div class="week-cols-grid" id="weekColsGrid"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="weekProgressBar" style="width:0%"></div></div>
      <div class="progress-label">
        <span>이번 주 전체 진행률</span>
        <span id="weekProgressText">0%</span>
      </div>
    </div>
  </div>

  <!-- 3. 월간 달력 -->
  <div class="card">
    <div class="card-header">
      <h2><span class="dot"></span>월간 달력</h2>
      <div class="cal-nav">
        <button id="prevMonth">‹</button>
        <span class="cal-title" id="calTitle"></span>
        <button id="nextMonth">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

</div>

<!-- 날짜별 일정 추가 모달 -->
<div class="modal-overlay" id="addTaskModal">
  <div class="modal-box">
    <h3 id="modalDateLabel"></h3>
    <input type="text" id="modalTaskInput" placeholder="일정을 입력하세요">
    <select class="cat-select" id="modalCategorySelect"></select>
    <div class="modal-actions">
      <button class="cancel-btn" id="modalCancelBtn">취소</button>
      <button class="confirm-btn" id="modalAddBtn">추가</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "scheduler_dashboard_data_v1";
  const DOW = ["일","월","화","수","목","금","토"];
  const WEEKDAYS = [
    { key:"mon", offset:1 },
    { key:"tue", offset:2 },
    { key:"wed", offset:3 },
    { key:"thu", offset:4 },
    { key:"fri", offset:5 }
  ];
  const CATEGORIES = ["SNS","디자인","서류","품의","지결","인플루언서","크리에이터","체험단","이벤트","기타"];
  const CATEGORY_COLORS = {
    "SNS":       { bg:"#e0f2fe", fg:"#0284c7" },
    "디자인":     { bg:"#f3e8ff", fg:"#9333ea" },
    "서류":       { bg:"#f1f5f9", fg:"#475569" },
    "품의":       { bg:"#fef3c7", fg:"#b45309" },
    "지결":       { bg:"#ccfbf1", fg:"#0f766e" },
    "인플루언서":  { bg:"#ffe4e6", fg:"#e11d48" },
    "크리에이터":  { bg:"#e0e7ff", fg:"#4338ca" },
    "체험단":     { bg:"#ecfccb", fg:"#4d7c0f" },
    "이벤트":     { bg:"#ffedd5", fg:"#c2410c" },
    "기타":       { bg:"#e5e7eb", fg:"#4b5563" }
  };

  function fmtDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function getWeekKey(d){
    const date = new Date(d);
    date.setHours(0,0,0,0);
    const dow = date.getDay();
    date.setDate(date.getDate() - dow);
    return fmtDate(date);
  }

  function loadData(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    let parsed = {};
    if(raw){
      try{ parsed = JSON.parse(raw); }catch(e){ parsed = {}; }
    }

    // 통합 데이터 구조(tasks: 날짜별 업무 배열)로 일회성 마이그레이션
    if(!parsed.tasks){
      parsed.tasks = {};

      if(parsed.todos){
        Object.keys(parsed.todos).forEach(dk=>{
          if(!parsed.tasks[dk]) parsed.tasks[dk] = [];
          parsed.tasks[dk].push(...parsed.todos[dk]);
        });
      }
      if(parsed.events){
        Object.keys(parsed.events).forEach(dk=>{
          if(!parsed.tasks[dk]) parsed.tasks[dk] = [];
          parsed.events[dk].forEach(txt=>{
            parsed.tasks[dk].push({ text: txt, done:false });
          });
        });
      }
      if(parsed.weekTasks){
        Object.keys(parsed.weekTasks).forEach(weekKey=>{
          const bucket = parsed.weekTasks[weekKey];
          if(!bucket || Array.isArray(bucket)) return;
          WEEKDAYS.forEach(wd=>{
            const arr = bucket[wd.key] || [];
            if(arr.length===0) return;
            const sunday = new Date(weekKey);
            const d = new Date(sunday);
            d.setDate(d.getDate() + wd.offset);
            const dk = fmtDate(d);
            if(!parsed.tasks[dk]) parsed.tasks[dk] = [];
            parsed.tasks[dk].push(...arr);
          });
        });
      }

      delete parsed.todos;
      delete parsed.events;
      delete parsed.weekTasks;
    }

    return parsed;
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  const data = loadData();
  saveData();

  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth(); // 0-based
  const todayKey = fmtDate(today);

  // ---------- 통합 데이터 접근 헬퍼 ----------
  function getTasks(dateKey){
    return data.tasks[dateKey] || [];
  }
  function addTask(dateKey, text, category){
    if(!data.tasks[dateKey]) data.tasks[dateKey] = [];
    data.tasks[dateKey].push({ text: text, done:false, category: category || CATEGORIES[0] });
  }
  function categoryColor(category){
    return CATEGORY_COLORS[category] || CATEGORY_COLORS["기타"];
  }
  function fillCategorySelect(selectEl, selected){
    selectEl.innerHTML = "";
    CATEGORIES.forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      selectEl.appendChild(opt);
    });
    selectEl.value = selected || CATEGORIES[0];
  }
  function makeCategoryTag(category){
    const tag = document.createElement("span");
    tag.className = "cat-tag";
    tag.textContent = category || "기타";
    const c = categoryColor(category);
    tag.style.background = c.bg;
    tag.style.color = c.fg;
    return tag;
  }

  // ---------- Header ----------
  document.getElementById("todayLabel").textContent =
    `오늘은 ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${DOW[today.getDay()]}요일) 입니다.`;
  document.getElementById("todoDateBadge").textContent =
    `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 ${DOW[today.getDay()]}요일`;

  const todoCategorySelect = document.getElementById("todoCategorySelect");
  fillCategorySelect(todoCategorySelect, CATEGORIES[0]);

  // ---------- 렌더 오케스트레이션 ----------
  function renderAll(){
    renderCalendar();
    renderWeekTasks();
    renderDaily();
  }

  // ---------- Calendar ----------
  const calGrid = document.getElementById("calGrid");
  const calTitle = document.getElementById("calTitle");

  function renderCalendar(){
    calTitle.textContent = `${calYear}년 ${calMonth+1}월`;
    calGrid.innerHTML = "";

    DOW.forEach(d=>{
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const firstDay = new Date(calYear, calMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const el = document.createElement("div");
      el.className = "cal-day empty";
      calGrid.appendChild(el);
    }

    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(calYear, calMonth, day);
      const key = fmtDate(dateObj);
      const isToday = key === todayKey;
      const el = document.createElement("div");
      el.className = "cal-day";
      if(isToday) el.classList.add("today");

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = day;
      el.appendChild(num);

      const addBtn = document.createElement("button");
      addBtn.className = "day-add-btn";
      addBtn.type = "button";
      addBtn.textContent = "+";
      addBtn.title = "일정 추가";
      addBtn.addEventListener("click", ()=> openModal(key, dateObj));
      el.appendChild(addBtn);

      const tasks = getTasks(key);
      if(tasks.length > 0){
        const badgeWrap = document.createElement("div");
        badgeWrap.className = "day-badges";
        const visible = tasks.slice(0, 2);
        visible.forEach((t, idx)=>{
          const badge = document.createElement("div");
          badge.className = "day-badge" + (t.done ? " done" : "");
          const c = isToday ? { bg:"rgba(255,255,255,0.28)", fg:"#fff" } : categoryColor(t.category);
          badge.style.background = c.bg;
          badge.style.color = c.fg;

          const txt = document.createElement("span");
          txt.className = "txt";
          txt.textContent = t.text;

          const del = document.createElement("button");
          del.className = "day-badge-del";
          del.type = "button";
          del.textContent = "×";
          del.addEventListener("click", ()=>{
            tasks.splice(idx, 1);
            saveData();
            renderAll();
          });

          badge.appendChild(txt);
          badge.appendChild(del);
          badgeWrap.appendChild(badge);
        });
        if(tasks.length > 2){
          const more = document.createElement("div");
          more.className = "day-badge-more";
          more.textContent = `+${tasks.length - 2}`;
          badgeWrap.appendChild(more);
        }
        el.appendChild(badgeWrap);
      }

      calGrid.appendChild(el);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });

  // ---------- 날짜별 일정 추가 모달 (달력 + 주간 업무 공용) ----------
  const modalOverlay = document.getElementById("addTaskModal");
  const modalDateLabel = document.getElementById("modalDateLabel");
  const modalTaskInput = document.getElementById("modalTaskInput");
  const modalCategorySelect = document.getElementById("modalCategorySelect");
  let modalDateKey = null;

  function openModal(dateKey, dateObj){
    modalDateKey = dateKey;
    modalDateLabel.textContent = `${dateObj.getFullYear()}년 ${dateObj.getMonth()+1}월 ${dateObj.getDate()}일 (${DOW[dateObj.getDay()]}) 업무 추가`;
    modalTaskInput.value = "";
    fillCategorySelect(modalCategorySelect, CATEGORIES[0]);
    modalOverlay.classList.add("open");
    modalTaskInput.focus();
  }
  function closeModal(){
    modalOverlay.classList.remove("open");
    modalDateKey = null;
  }
  function submitModal(){
    const val = modalTaskInput.value.trim();
    if(!val || !modalDateKey) return;
    addTask(modalDateKey, val, modalCategorySelect.value);
    saveData();
    closeModal();
    renderAll();
  }
  document.getElementById("modalAddBtn").addEventListener("click", submitModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  modalTaskInput.addEventListener("keydown", e=>{
    if(e.key === "Enter") submitModal();
    if(e.key === "Escape") closeModal();
  });
  modalOverlay.addEventListener("click", e=>{
    if(e.target === modalOverlay) closeModal();
  });

  // ---------- Weekly tasks (Mon-Fri columns) ----------
  const weekKey = getWeekKey(today);
  const weekColsGrid = document.getElementById("weekColsGrid");
  const weekProgressBar = document.getElementById("weekProgressBar");
  const weekProgressText = document.getElementById("weekProgressText");
  const weekRangeLabel = document.getElementById("weekRange");

  function renderWeekRange(){
    const start = new Date(weekKey);
    const end = new Date(start);
    end.setDate(end.getDate()+6);
    const fmt = d => `${d.getMonth()+1}.${d.getDate()}`;
    weekRangeLabel.textContent = `${fmt(start)} - ${fmt(end)}`;
  }

  function renderWeekTasks(){
    weekColsGrid.innerHTML = "";
    const sundayOfWeek = new Date(weekKey);
    let totalAll = 0, doneAll = 0;

    WEEKDAYS.forEach(wd=>{
      const colDate = new Date(sundayOfWeek);
      colDate.setDate(colDate.getDate() + wd.offset);
      const colKey = fmtDate(colDate);
      const isToday = colKey === todayKey;
      const tasks = getTasks(colKey);

      const col = document.createElement("div");
      col.className = "week-col" + (isToday ? " today-col" : "");

      const header = document.createElement("div");
      header.className = "week-col-header";
      const dayLabel = document.createElement("span");
      dayLabel.className = "day-label";
      dayLabel.textContent = `${DOW[colDate.getDay()]}(${colDate.getMonth()+1}.${colDate.getDate()})`;
      header.appendChild(dayLabel);

      const addBtn = document.createElement("button");
      addBtn.className = "week-add-btn";
      addBtn.type = "button";
      addBtn.textContent = "+";
      addBtn.title = "업무 추가";
      addBtn.addEventListener("click", ()=> openModal(colKey, colDate));
      header.appendChild(addBtn);

      col.appendChild(header);

      const tasksWrap = document.createElement("div");
      tasksWrap.className = "week-col-tasks";

      if(tasks.length === 0){
        const empty = document.createElement("div");
        empty.className = "week-col-empty";
        empty.textContent = "업무 없음";
        tasksWrap.appendChild(empty);
      }

      tasks.forEach((task, idx)=>{
        totalAll++;
        if(task.done) doneAll++;

        const row = document.createElement("div");
        row.className = "week-task-item" + (task.done ? " done" : "");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;
        cb.addEventListener("change", ()=>{
          task.done = cb.checked;
          saveData();
          renderAll();
        });

        const tag = makeCategoryTag(task.category);

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = task.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.addEventListener("click", ()=>{
          tasks.splice(idx,1);
          saveData();
          renderAll();
        });

        row.appendChild(cb);
        row.appendChild(tag);
        row.appendChild(label);
        row.appendChild(del);
        tasksWrap.appendChild(row);
      });

      col.appendChild(tasksWrap);
      weekColsGrid.appendChild(col);
    });

    const pct = totalAll === 0 ? 0 : Math.round((doneAll/totalAll)*100);
    weekProgressBar.style.width = pct + "%";
    weekProgressText.textContent = `${pct}% (${doneAll}/${totalAll})`;
  }

  // ---------- Daily To-Do ----------
  const todoList = document.getElementById("todoList");
  const todoInput = document.getElementById("todoInput");
  const todoStats = document.getElementById("todoStats");
  let dailyEditingIndex = null;

  function saveEdit(idx, newVal, newCategory){
    const val = newVal.trim();
    if(!val) return;
    const tasks = getTasks(todayKey);
    tasks[idx].text = val;
    tasks[idx].category = newCategory || CATEGORIES[0];
    dailyEditingIndex = null;
    saveData();
    renderAll();
  }

  function renderDaily(){
    const tasks = getTasks(todayKey);
    todoList.innerHTML = "";

    if(tasks.length === 0){
      const empty = document.createElement("div");
      empty.className = "todo-empty";
      empty.textContent = "오늘의 할 일을 추가해보세요.";
      todoList.appendChild(empty);
      todoStats.textContent = "";
      return;
    }

    tasks.forEach((todo, idx)=>{
      const row = document.createElement("div");
      row.className = "todo-item" + (todo.done ? " done" : "");

      if(dailyEditingIndex === idx){
        row.classList.add("editing");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = todo.done;
        cb.disabled = true;
        row.appendChild(cb);

        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "edit-input";
        editInput.value = todo.text;
        row.appendChild(editInput);

        const editCategorySelect = document.createElement("select");
        editCategorySelect.className = "cat-select";
        fillCategorySelect(editCategorySelect, todo.category);
        row.appendChild(editCategorySelect);

        const saveBtn = document.createElement("button");
        saveBtn.className = "save";
        saveBtn.textContent = "✓";
        saveBtn.title = "저장";
        saveBtn.addEventListener("click", ()=> saveEdit(idx, editInput.value, editCategorySelect.value));
        row.appendChild(saveBtn);

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "del";
        cancelBtn.style.opacity = "1";
        cancelBtn.textContent = "✕";
        cancelBtn.title = "취소";
        cancelBtn.addEventListener("click", ()=>{
          dailyEditingIndex = null;
          renderDaily();
        });
        row.appendChild(cancelBtn);

        todoList.appendChild(row);

        editInput.addEventListener("keydown", e=>{
          if(e.key === "Enter") saveEdit(idx, editInput.value, editCategorySelect.value);
          if(e.key === "Escape"){ dailyEditingIndex = null; renderDaily(); }
        });
        editInput.focus();
        editInput.select();
        return;
      }

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = todo.done;
      cb.addEventListener("change", ()=>{
        todo.done = cb.checked;
        saveData();
        renderAll();
      });

      const tag = makeCategoryTag(todo.category);

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = todo.text;

      const editBtn = document.createElement("button");
      editBtn.className = "edit";
      editBtn.textContent = "✎";
      editBtn.title = "수정";
      editBtn.addEventListener("click", ()=>{
        dailyEditingIndex = idx;
        renderDaily();
      });

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.title = "삭제";
      del.addEventListener("click", ()=>{
        tasks.splice(idx,1);
        if(dailyEditingIndex === idx) dailyEditingIndex = null;
        saveData();
        renderAll();
      });

      row.appendChild(cb);
      row.appendChild(tag);
      row.appendChild(label);
      row.appendChild(editBtn);
      row.appendChild(del);
      todoList.appendChild(row);
    });

    const total = tasks.length;
    const doneCount = tasks.filter(t=>t.done).length;
    todoStats.textContent = `완료 ${doneCount} / 전체 ${total}`;
  }

  function addTodo(){
    const val = todoInput.value.trim();
    if(!val) return;
    addTask(todayKey, val, todoCategorySelect.value);
    todoInput.value = "";
    saveData();
    renderAll();
  }
  document.getElementById("addTodoBtn").addEventListener("click", addTodo);
  todoInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addTodo(); });

  // ---------- Init ----------
  renderWeekRange();
  renderAll();

})();
</script>
</body>
</html>
